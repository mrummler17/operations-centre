const { useState, useEffect, useCallback } = React;
const BRIEFING = {"site":{"version":"6.26","title":"OPSCEN v6.26 — Iran Theatre Intelligence Briefing","theatre":"IRAN THEATRE INTELLIGENCE BRIEFING","operation":"OPERATION EPIC FURY","day":47,"subhead":"BLOCKADE HOLDS — TALKS MAY RESUME — HORMUZ BELOW NORMAL","briefingEpoch":"15-APR-2026 0830 AEST","deadlineUtc":"2026-04-22T00:00:00.000Z","defconLevel":3,"defconSummary":"BLOCKADE ACTIVE • TALKS FLICKER • DEFCON 3 HOLDS","liveLabel":"LIVE"},"meta":{"description":"Day 47. The U.S. blockade on Iranian port calls is active, but public reporting points to possible renewed talks and a still-constrained Strait of Hormuz. Australia remains on fuel watch.","ogDescription":"Day 47 — blockade active, Hormuz traffic still below normal, oil easing on talk hopes, and Australia fuel stocks broadly steady with local outages still visible."},"xImagePrompt":{"dateDay":"APR 15, 2026 // DAY 47","headline":"BLOCKADE HOLDS","subheadline":"TALKS MAY RESUME. SHIPPING STAYS DISTORTED.","bullets":["THE U.S. BLOCKADE ON VESSELS CALLING AT IRANIAN PORTS IS ACTIVE, BUT REUTERS REPORTS NEGOTIATORS COULD RETURN TO ISLAMABAD LATER THIS WEEK.","HORMUZ TRAFFIC IS STILL MOVING FOR SOME NON-IRAN-BOUND VESSELS, YET CROSSINGS REMAIN FAR BELOW PRE-WAR NORMAL.","AUSTRALIA STAYS ON FUEL WATCH: BOWEN SAYS 57 SHIPS ARE INBOUND WHILE CHECK PETROL STILL SHOWS HUNDREDS OF LOCAL OUTAGES."],"status":"ESCALATION LEVEL / STATUS: HIGH"},"ticker":["urgent // blockade enters day two","diplomacy // us-iran teams could return to islamabad this week","hormuz // traffic moving, still far below pre-war normal","markets // oil drops back below $100 on talk hopes","lebanon // first direct israel-lebanon talks in washington","china // warns against blockade escalation","australia fuel // 57 ships inbound, stocks broadly steady","assessment // defcon 3 holds: coercion active, diplomacy still alive"],"readme":{"repoTitle":"OPSCEN v6.26 — Iran Theatre Intelligence Briefing","tagline":"A real-time military operations centre dashboard tracking the 2026 Iran conflict, originally built in [Claude](https://claude.ai) and now run through a Codex-powered publishing workflow by [RETSA Group](https://retsagroup.com.au).","liveUrl":"https://mrummler17.github.io/operations-centre","whatIsThis":["Rather than flicking between 7 News, 9, ABC and YouTube trying to piece together what's happening with Iran — I run an \"update briefing\" workflow.","It searches the web, refreshes my custom ops centre with today's intel, updates the site, and gives me personalised action items for my business and household.","Two words. Fresh every morning. The news comes to me now."],"features":["CRT military aesthetic — retro-futuristic operations centre design","Two-tab interface — Briefing view + interactive Fuel Depletion Forecast","Key metrics dashboard — quick-reference tiles at top of page","9 collapsible intelligence sections covering all theatres of the conflict","Australian Fuel Forecast module — interactive depletion projections for petrol, diesel, and jet fuel with scenario presets and adjustable parameters","Live radio monitor — embedded NPR public audio feed inside the dashboard","Live system clock (Sydney + UTC)","DEFCON gauge with visual assessment","Multi-theatre threat matrix — 9 active zones tracked","Scenario analysis with probability-weighted forecasts","Australian-specific sections — ASX 200, RBA rate impacts, fuel crisis monitoring","UPDATED badges showing what changed since last briefing"],"currentBriefing":["The U.S. blockade on vessels calling at Iranian ports is now active, but Reuters reports U.S. and Iranian teams could return to Islamabad later this week.","Hormuz remains navigable for some non-Iran-bound traffic, yet Reuters shipping data says crossings are still only a fraction of the 130-plus daily pre-war norm.","Oil has eased back below $100 on renewed talk hopes, which matters because the market is still trading shipping risk more than rhetoric.","Washington also hosted the first direct Israel-Lebanon talks in decades on April 14, a real diplomatic opening even as Hezbollah fighting continues.","Australia remains on fuel watch rather than fuel panic: Chris Bowen says 57 ships are inbound and national stock days are broadly steady, but local outages persist.","The working outlook is still a fragile maritime standoff, not a clean settlement and not yet a verified return to wider U.S. strike escalation.","The next hard trigger is whether talks actually resume and whether Hormuz traffic normalises in commercial practice, not just on paper."],"howItWorks":["I run \"update briefing\" against the structured briefing file","The workflow searches the web across multiple sources","It refreshes the dashboard and README from the latest data","I preview the output locally and publish in one command","I also get a ready-to-post X image prompt"],"tech":"Single self-contained HTML file. React 18 via CDN. Structured JSON briefing data. Local preview and one-command publish. Zero runtime dependencies.","author":{"name":"Marcus Rummler","xUrl":"https://x.com/Marcus_Rummler","company":"RETSA Group","companyUrl":"https://retsagroup.com.au","bio":"Founder, [RETSA Group](https://retsagroup.com.au) — Instructional design & AI-powered tech solutions.","note":"I can't code. I've never been able to code. But I've shipped a SaaS product and built a military ops centre. All with AI."},"license":"MIT"},"keyMetrics":[{"label":"WAR DAY","value":"47","color":"var(--crt-red)"},{"label":"DEADLINE","value":"1 WEEK","color":"var(--crt-amber)","delta":"CEASEFIRE WINDOW","deltaColor":"#ffaa00"},{"label":"HORMUZ","value":"OPEN*","color":"var(--crt-amber)","delta":"BELOW NORMAL","deltaColor":"#ff4400"},{"label":"TALKS","value":"RESTART?","color":"var(--crt-amber)","delta":"ISLAMABAD","deltaColor":"#ffaa00"},{"label":"OIL","value":"<$100","color":"var(--crt-cyan)","delta":"TALK HOPES","deltaColor":"#00ffcc"},{"label":"LEBANON","value":"DIRECT TALKS","color":"var(--crt-amber)","delta":"WASHINGTON","deltaColor":"#ffaa00"},{"label":"LEAD SCENARIO","value":"MARITIME STANDOFF","color":"var(--crt-amber)","delta":"50%","deltaColor":"#ffaa00"},{"label":"STRIKE CYCLE","value":"35%","color":"var(--crt-amber)","delta":"BLOCKADE, NOT BREAKTHROUGH","deltaColor":"#ffaa00"}],"threatMatrix":[{"theatre":"IRAN (MAINLAND)","level":"SEVERE","color":"#ff4400"},{"theatre":"STRAIT OF HORMUZ","level":"CRITICAL","color":"#ff0000"},{"theatre":"ISRAEL (HOME)","level":"SEVERE","color":"#ff4400"},{"theatre":"LEBANON","level":"SEVERE","color":"#ff4400"},{"theatre":"YEMEN/HOUTHIS","level":"SEVERE","color":"#ff4400"},{"theatre":"GULF STATES","level":"HIGH","color":"#ffaa00"},{"theatre":"GLOBAL ECON","level":"HIGH","color":"#ffaa00"},{"theatre":"NUCLEAR","level":"HIGH","color":"#ffaa00"},{"theatre":"AUSTRALIA","level":"ELEVATED","color":"#cccc00"},{"theatre":"IRAQ/PROXIES","level":"ELEVATED","color":"#cccc00"}],"sections":[{"id":"sitrep","title":"SITUATION REPORT","icon":"⚡","content":{"heading":"DAY 47 -- BLOCKADE ACTIVE / TALKS MAY RESUME / SHIPPING STILL CONSTRAINED","lines":["[!] THE LEAD VERIFIED CHANGE is not a new strike wave but the start of the U.S. blockade on ships calling at Iranian ports after the weekend Islamabad talks ended without a breakthrough.","REUTERS REPORTED on April 14 that U.S. and Iranian teams could return to Islamabad as early as later this week. That keeps a diplomatic channel alive even after the blockade decision.","THE MOST IMPORTANT SHIPPING FACT is that Hormuz is not fully shut. Reuters shipping data showed vessels still transiting on the first full day of the blockade, but total traffic remains far below the pre-war norm.","THAT MAKES THE CURRENT PHASE best described as maritime coercion with an active diplomatic backchannel, not a settled peace and not yet a verified return to full-scale U.S. air escalation.","CHINA HAS PUBLICLY WARNED against the blockade, which matters because Beijing remains highly exposed to Gulf energy flows and is pressing for talks to resume.","WASHINGTON ALSO OPENED a second diplomatic track by hosting direct Israel-Lebanon talks on April 14, showing that regional de-escalation efforts are broader than the Iran file alone.","AUSTRALIA IS STILL IN THE INDIRECT FIRE: fuel security remains a shipping and refining problem, not a military one, but the market and logistics effects are real.","WORKING JUDGMENT: blockade enforcement is real, diplomacy is still flickering, and commercial normalisation in Hormuz remains the clearest test of whether this stabilises or slides."]}},{"id":"kinetic","title":"KINETIC OPERATIONS","icon":"🎯","content":{"heading":"TOP-LINE STRIKE CYCLE STILL PAUSED / MARITIME ENFORCEMENT DOMINATES / ESCALATION RISK REMAINS","lines":["THERE IS NO FRESH VERIFIED PUBLIC REPORTING of a resumed large-scale U.S. strike cycle against mainland Iran in the last 24 hours. The coercive center of gravity has shifted to blockade enforcement and signalling.","THAT DOES NOT MEAN THE MILITARY RISK IS LOW. The blockade itself is a force-backed operation, and any interception, mining incident or strike on Gulf shipping could re-ignite the air war quickly.","THE CLEANEST READ from public reporting is that Washington is trying to keep pressure high while still leaving space for renewed Islamabad talks rather than immediately reopening the heaviest strike phase.","FOR THIS PANEL, THE KEY UPDATE is absence of verified new massed strikes, not proof of durable de-escalation.","WORKING JUDGMENT: operational tempo has shifted from headline bombing to coercive containment, but the escalation ladder remains short."]}},{"id":"iran_response","title":"IRANIAN RETALIATION","icon":"🚀","content":{"heading":"TEHRAN REJECTS THE BLOCKADE / TALKS CHANNEL STILL OPEN / TRUST STILL CLOSE TO ZERO","lines":["IRANIAN RHETORIC remains hostile, with the blockade treated publicly as illegitimate and escalatory rather than as part of a workable ceasefire framework.","AT THE SAME TIME, Reuters reports both sides have kept the end-of-week window open for another round in Islamabad. That is the most important sign that negotiation has not collapsed outright.","THE CURRENT SIGNAL from Tehran is classic dual-track behaviour: denounce the pressure publicly, preserve room to bargain privately, and avoid looking cornered domestically.","THAT DOES NOT EQUATE to trust. Public reporting still describes deep disagreement over nuclear restrictions and the terms of any longer pause.","WORKING JUDGMENT: Iran is resisting coercion in public while still keeping a narrow route back into talks."]}},{"id":"lebanon","title":"LEBANON / HEZBOLLAH FRONT","icon":"🔥","content":{"heading":"LEBANON FRONT STILL HOT / DIRECT TALKS OPEN / HEZBOLLAH RISK PERSISTS","lines":["AP REPORTED on April 14 that Israel and Lebanon held their first direct diplomatic talks in more than three decades in Washington.","THAT IS A REAL DIPLOMATIC DEVELOPMENT, but it does not mean the front is quiet. Hezbollah rejected the process and fighting continued as the meeting opened.","THE HUMAN COST remains severe. AP reported the month-long war has killed more than 2,100 people in Lebanon and displaced more than one million.","FOR THE WIDER IRAN THEATRE, Lebanon is still the clearest reminder that regional spillover remains active even while diplomats reopen side channels.","WORKING JUDGMENT: Lebanon has moved from pure spillover risk to active test case for whether U.S.-backed diplomacy can narrow a live proxy front."]}},{"id":"hormuz","title":"STRAIT OF HORMUZ","icon":"🚢","content":{"heading":"BLOCKADE ACTIVE / TRAFFIC STILL MOVING / COMMERCIAL NORMALITY STILL ABSENT","lines":["REUTERS SHIPPING DATA showed the first full day of the U.S. blockade made little immediate difference to whether some ships could still pass through Hormuz.","THAT IS NOT THE SAME as recovery. Reuters also reported total traffic remains only a fraction of the 130-plus daily crossings seen before the war started on February 28.","THE CURRENT FACT PATTERN nother dramatic oil spike.","THAT MEANS the ASX story is still about energy pass-through, inflation persistence and whether traders start seeing this as a longer maritime disruption rather than a short war shock.","WORKING JUDGMENT: Australia has avoided the worst case for now, but remains exposed to any renewed jump in crude, insurance and refined-product freight costs."]}},{"id":"fuel_au","title":"AUSTRALIA FUEL SITUATION","icon":"⛽","content":{"heading":"AU FUEL WATCH HOLDS / 57 SHIPS INBOUND / LOCAL OUTAGES STILL VISIBLE","lines":["CHRIS BOWEN SAID on April 13 that Australia had 38 days of petrol, 31 days of diesel and 28 days of jet fuel on hand, with 57 fuel ships currently on the way to Australia.","BOWEN ALSO SAID no cargo expected to arrive in Australia has failed to arrive since the war began, and that any cancelled forward orders had been replaced.","THAT SUPPORTS a national-level reading of stressed but functioning supply rather than imminent system failure.","AT THE SAME TIME, Check Petrol's public outage tracker showed 579 stations affected at 6:30 pm AEST on April 14, with overall availability still at 97% across 7,444 tracked stations.","THE OUTAGES REMAIN unevenly distributed. Check Petrol listed New South Wales with 193 affected stations, Victoria 147, Queensland 101 and South Australia 86.","WORKING JUDGMENT: Australia remains on fuel watch, not fuel panic. National stock cover is broadly steady, but household and regional disruption is still visible on the ground."]}},{"id":"scenarios","title":"SCENARIO ANALYSIS","icon":"🔮","content":{"heading":"DAY 47 -- BLOCKADE HOLDS / TALKS FLICKER / OUTCOME STILL FRAGILE","lines":["[!] LEAD SCENARIO -- MARITIME STANDOFF (50%): blockade enforcement stays active, Hormuz remains commercially constrained, and diplomacy prevents an immediate return to the heaviest strike cycle.","SCENARIO A -- EXTENDED WAR OF PRESSURE (30%): still plausible if talks do not resume or if the blockade triggers a serious naval or shipping incident.","SCENARIO B -- ENERGY ESCALATION SPIRAL (15%): lower than the weekend panic but still dangerous because Hormuz throughput remains far below normal.","SCENARIO C -- MANAGED WIND-DOWN (5%): still low, because public rhetoric and unresolved nuclear terms remain too hard for a clean settlement story.","THE BIG CHANGE versus the previous briefing is that the public reporting now supports a blended picture: active coercion, yes, but also a real if narrow diplomatic reopening.","BOTTOM LINE: the next decisive indicators are whether teams actually return to Islamabad and whether commercial shipping confidence starts to recover in observable data."]}}],"fuelModule":{"baseDate":"2026-03-10T00:00:00.000Z","stocksMl":{"petrol":1606,"diesel":2757,"jet":812},"dailyMl":{"petrol":43.4,"diesel":91.9,"jet":28},"msoMl":{"petrol":400,"diesel":362,"jet":0},"scenarios":{"optimistic":{"name":"GOVT OPTIMISTIC","demand":1,"imports":80,"refBoost":true,"reserve":true,"color":"#44cc44"},"current":{"name":"CURRENT TRAJECTORY","demand":1.3,"imports":60,"refBoost":true,"reserve":true,"color":"#ffaa00"},"prolonged":{"name":"HORMUZ PROLONGED","demand":1.5,"imports":30,"refBoost":true,"reserve":true,"color":"#ff6600"},"worst":{"name":"WORST CASE","demand":2,"imports":10,"refBoost":false,"reserve":false,"color":"#ff0000"}},"liveContext":[{"text":"Check Petrol showed 579 stations affected nationally at 6:30 pm AEST on 14 Apr, with 97% availability across 7,444 tracked sites.","variant":"warn"},{"text":"NSW 193 / VIC 147 / QLD 101 / SA 86 / TAS 34 / WA 13 / NT 4 / ACT 1. Local disruption remains real but uneven.","variant":"warn"},{"text":"Bowen said Australia had 38 days of petrol, 31 days of diesel and 28 days of jet fuel on hand on 13 Apr.","variant":"default"},{"text":"Fifty-seven fuel ships are currently inbound to Australia, with 4.1 billion litres contracted over the next four weeks, according to Bowen.","variant":"default"},{"text":"No expected cargo has failed to arrive since function useClock() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  return now;
}

function formatSydneyTime(date) {
  const formatter = new Intl.DateTimeFormat("en-AU", {
    timeZone: "Australia/Sydney",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false,
    timeZoneName: "short",
  });
  const parts = formatter.formatToParts(date);
  const get = (type) => parts.find((part) => part.type === type)?.value || "";
  return get("year") + "-" + get("month") + "-" + get("day") + " " + get("hour") + ":" + get("minute") + ":" + get("second") + " " + get("timeZoneName");
}

function formatUtcTime(date) {
  return date.toISOString().replace("T", " ").slice(0, 19) + "Z";
}

const FUEL_BASE_DATE = new Date(BRIEFING.fuelModule.baseDate);
const FUEL_STOCKS_ML = BRIEFING.fuelModule.stocksMl;
const FUEL_DAILY_ML = BRIEFING.fuelModule.dailyMl;
const FUEL_MSO_ML = BRIEFING.fuelModule.msoMl;
const FUEL_SCENARIOS = BRIEFING.fuelModule.scenarios;

function projectFuel(params) {
  const importFactor = params.imports / 100;
  const data = [];
  const stocks = { ...FUEL_STOCKS_ML };
  const reservePerDay = {
    petrol: params.reserve ? FUEL_MSO_ML.petrol / 21 : 0,
    diesel: params.reserve ? FUEL_MSO_ML.diesel / 21 : 0,
    jet: 0,
  };
  const dryDays = { petrol: null, diesel: null, jet: null };

  for (let day = 0; day <= 120; day += 1) {
    data.push({
      day,
      date: new Date(FUEL_BASE_DATE.getTime() + day * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" }),
      petrol: Math.max(0, stocks.petrol),
      diesel: Math.max(0, stocks.diesel),
      jet: Math.max(0, stocks.jet),
    });

    ["petrol", "diesel", "jet"].forEach((fuel) => {
      const consumption = FUEL_DAILY_ML[fuel] * params.demand;
      const imports = FUEL_DAILY_ML[fuel] * importFactor;
      const refineryBoost = fuel === "petrol" && params.refBoost ? 3.3 : 0;
      const reserveRelease = day >= 7 && day < 28 ? reservePerDay[fuel] : 0;

      stocks[fuel] = stocks[fuel] - consumption + imports + refineryBoost + reserveRelease;

      if (stocks[fuel] <= 0 && dryDays[fuel] === null) {
        dryDays[fuel] = day;
        stocks[fuel] = 0;
      }
    });
  }

  return { data, dryDays };
}

function fuelDaysColor(days) {
  if (days <= 7) return "var(--crt-red)";
  if (days <= 14) return "var(--crt-amber)";
  return "var(--crt-green)";
}

function fuelStatus(daysUntilEmpty, depleted) {
  if (depleted) return { text: "DEPLETED", color: "var(--crt-red)", bg: "rgba(255,50,50,0.15)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 7) return { text: "EMERGENCY", color: "var(--crt-red)", bg: "rgba(255,50,50,0.1)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 14) return { text: "RATIONING LIKELY", color: "var(--crt-amber)", bg: "rgba(255,170,0,0.1)", border: "var(--crt-amber)" };
  return { text: "MONITORING", color: "var(--crt-green)", bg: "rgba(50,255,50,0.05)", border: "var(--crt-green)" };
}

function FuelForecast() {
  const [demand, setDemand] = useState(FUEL_SCENARIOS.current.demand);
  const [imports, setImports] = useState(FUEL_SCENARIOS.current.imports);
  const [refBoost, setRefBoost] = useState(FUEL_SCENARIOS.current.refBoost);
  const [reserve, setReserve] = useState(FUEL_SCENARIOS.current.reserve);
  const [preset, setPreset] = useState("current");

  function applyPreset(key) {
    const scenario = FUEL_SCENARIOS[key];
    setDemand(scenario.demand);
    setImports(scenario.imports);
    setRefBoost(scenario.refBoost);
    setReserve(scenario.reserve);
    setPreset(key);
  }

  const result = projectFuel({ demand, imports, refBoost, reserve });
  const chartData = result.data;
  const dryDays = result.dryDays;
  const width = 900;
  const height = 300;
  const paddingLeft = 55;
  const paddingRight = 15;
  const paddingTop = 15;
  const paddingBottom = 35;
  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;
  const maxValue = Math.max(FUEL_STOCKS_ML.petrol, FUEL_STOCKS_ML.diesel, FUEL_STOCKS_ML.jet) * 1.05;
  const fuels = [
    { name: "PETROL", key: "petrol", color: "#33ff33" },
    { name: "DIESEL", key: "diesel", color: "#ff6600" },
    { name: "JET FUEL", key: "jet", color: "#00ffcc" },
  ];

  function seriesPath(key) {
    return chartData.map((point, index) => {
      const x = paddingLeft + (index / 120) * plotWidth;
      const y = paddingTop + plotHeight - (point[key] / maxValue) * plotHeight;
      return `${index === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  function areaPath(key) {
    return `${seriesPath(key)} L${paddingLeft + plotWidth},${paddingTop + plotHeight} L${paddingLeft},${paddingTop + plotHeight} Z`;
  }

  function yPosition(value) {
    return paddingTop + plotHeight - (value / maxValue) * plotHeight;
  }

  return (
    <div>
      <div className="countdown-row">
        {fuels.map((fuel) => {
          const depleted = dryDays[fuel.key] !== null;
          const daysUntilEmpty = depleted ? dryDays[fuel.key] : 120;
          const depletionDate = depleted
            ? new Date(FUEL_BASE_DATE.getTime() + dryDays[fuel.key] * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" })
            : "120+ DAYS";
          const status = fuelStatus(daysUntilEmpty, depleted);

          return (
            <div key={fuel.key} className="cd-card">
              <div className="cd-label">{fuel.name}</div>
              <div className="cd-value" style={{ color: depleted ? "var(--crt-red)" : fuelDaysColor(daysUntilEmpty) }}>
                {depleted ? daysUntilEmpty : daysUntilEmpty >= 120 ? "120+" : daysUntilEmpty}
              </div>
              <div className="cd-sub">DAYS UNTIL DEPLETION</div>
              <div className="cd-sub" style={{ color: depleted ? "var(--crt-red)" : "var(--crt-dim)", marginTop: 2 }}>
                {depleted ? `DRY: ${depletionDate}` : depletionDate}
              </div>
              <div className="cd-status" style={{ color: status.color, background: status.bg, border: `1px solid ${status.border}` }}>
                {status.text}
              </div>
            </div>
          );
        })}
      </div>

      <div className="presets">
        {Object.entries(FUEL_SCENARIOS).map(([key, scenario]) => (
          <button
            key={key}
            className={`preset-btn ${preset === key ? "active" : ""}`}
            style={{ border: `1px solid ${scenario.color}`, color: scenario.color }}
            onClick={() => applyPreset(key)}
          >
            {scenario.name}
          </button>
        ))}
      </div>

      <div className="ctrl-box">
        <div className="ctrl-title">INTERACTIVE PARAMETERS</div>
        <div className="ctrl-grid">
          <div className="ctrl-item">
            <label>DEMAND MULTIPLIER <span className="ctrl-val">{demand.toFixed(1)}x</span></label>
            <input type="range" min="0.8" max="2.5" step="0.1" value={demand} onChange={(event) => { setDemand(parseFloat(event.target.value)); setPreset(null); }} />
          </div>
          <div className="ctrl-item">
            <label>IMPORT FLOW RATE <span className="ctrl-val">{imports}%</span></label>
            <input type="range" min="0" max="100" step="5" value={imports} onChange={(event) => { setImports(parseInt(event.target.value, 10)); setPreset(null); }} />
          </div>
        </div>
        <div className="toggle-row">
          <button className={`toggle-btn ${refBoost ? "on" : ""}`} onClick={() => { setRefBoost(!refBoost); setPreset(null); }}>
            {(refBoost ? "[ON]" : "[OFF]") + " SULPHUR WAIVER (+3.3 ML/day petrol)"}
          </button>
          <button className={`toggle-btn ${reserve ? "on" : ""}`} onClick={() => { setReserve(!reserve); setPreset(null); }}>
            {(reserve ? "[ON]" : "[OFF]") + " MSO RESERVE RELEASE (762 ML)"}
          </button>
        </div>
      </div>

      <div className="chart-panel">
        <div className="chart-title">DEPLETION CURVES - MILLION LITRES REMAINING</div>
        <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", fontFamily: "'Share Tech Mono', monospace" }}>
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <line key={`grid-${fraction}`} x1={paddingLeft} y1={y} x2={paddingLeft + plotWidth} y2={y} stroke="#1a3a1a" strokeDasharray="3 3" />;
          })}
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <text key={`label-${fraction}`} x={paddingLeft - 5} y={y + 4} textAnchor="end" fill="#3a7a3a" fontSize="10">{(maxValue * fraction / 1000).toFixed(1)}k</text>;
          })}
          {[0, 30, 60, 90, 120].map((day) => {
            const x = paddingLeft + (day / 120) * plotWidth;
            return <text key={`day-${day}`} x={x} y={paddingTop + plotHeight + 20} textAnchor="middle" fill="#3a7a3a" fontSize="10">{chartData[day] ? chartData[day].date : ""}</text>;
          })}
          <line x1={paddingLeft} y1={yPosition(14 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(14 * FUEL_DAILY_ML.diesel)} stroke="#ffaa00" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(14 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ffaa00" fontSize="9">RATIONING 14d</text>
          <line x1={paddingLeft} y1={yPosition(7 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(7 * FUEL_DAILY_ML.diesel)} stroke="#ff3333" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(7 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ff3333" fontSize="9">EMERGENCY 7d</text>
          <path d={areaPath("diesel")} fill="rgba(255,102,0,0.15)" />
          <path d={areaPath("petrol")} fill="rgba(51,255,51,0.15)" />
          <path d={areaPath("jet")} fill="rgba(0,255,204,0.15)" />
          <path d={seriesPath("petrol")} fill="none" stroke="#33ff33" strokeWidth="2" />
          <path d={seriesPath("diesel")} fill="none" stroke="#ff6600" strokeWidth="2" />
          <path d={seriesPath("jet")} fill="none" stroke="#00ffcc" strokeWidth="2" />
          <line x1={paddingLeft} y1={paddingTop} x2={paddingLeft} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
          <line x1={paddingLeft} y1={paddingTop + plotHeight} x2={paddingLeft + plotWidth} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
        </svg>
        <div className="legend-row">
          <div className="legend-item"><div className="legend-dot" style={{ background: "#33ff33" }} /> PETROL</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#ff6600" }} /> DIESEL (PRIORITY)</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#00ffcc" }} /> JET FUEL</div>
          <div className="legend-item" style={{ color: "#ffaa00" }}>--- RATIONING (14d)</div>
          <div className="legend-item" style={{ color: "#ff3333" }}>--- EMERGENCY (7d)</div>
        </div>
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">LIVE OUTAGE DATA (via checkpetrol.com.au)</div>
        {BRIEFING.fuelModule.liveContext.map((line) => <div key={line.text} className={`ctx-line ${line.variant === "default" ? "" : line.variant}`}>{line.text}</div>)}
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">FORECAST DATA SOURCES</div>
        {BRIEFING.fuelModule.sourceNotes.map((note) => <div key={note} className="ctx-line">{note}</div>)}
      </div>
    </div>
  );
}

function OPSCEN() {
  const clock = useClock();
  const [openSections, setOpenSections] = useState({ sitrep: true });
  const [allOpen, setAllOpen] = useState(false);
  const [fontSize, setFontSize] = useState(1);
  const [activeTab, setActiveTab] = useState("briefing");
  const fontScale = [14, 16, 19][fontSize];
  const defconLevel = BRIEFING.site.defconLevel;
  const defconInfo = DEFCON_LEVELS.find((item) => item.level === defconLevel);
  const utcStr = formatUtcTime(clock);
  const sydneyStr = formatSydneyTime(clock);
  const deadlineUtc = new Date(BRIEFING.site.deadlineUtc);
  const msLeft = deadlineUtc - clock;
  const daysLeft = Math.max(0, Math.ceil(msLeft / 86400000));
  const countdownStr = msLeft > 0 ? `${daysLeft} DAY${daysLeft !== 1 ? "S" : ""} REMAINING` : "EXPIRED";

  const toggleSection = useCallback((id) => {
    setOpenSections((previous) => ({ ...previous, [id]: !previous[id] }));
  }, []);

  const toggleAll = useCallback(() => {
    const nextState = !allOpen;
    setAllOpen(nextState);
    const nextSections = {};
    BRIEFING.sections.forEach((section) => {
      nextSections[section.id] = nextState;
    });
    setOpenSections(nextSections);
  }, [allOpen]);

  return (
    <React.Fragment>
      <div className="scanlines" />
      <div className="opscen-container" style={{ fontSize: fontScale }}>
        <div className="header-bar">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div className="header-title crt-glow">{"◤"} OPSCEN v{BRIEFING.site.version} {"◢"}</div>
            <div className="font-controls">
              <button className={`font-btn ${fontSize === 0 ? "active" : ""}`} onClick={() => setFontSize(0)} style={{ fontSize: 13 }}>A-</button>
              <button className={`font-btn ${fontSize === 1 ? "active" : ""}`} onClick={() => setFontSize(1)} style={{ fontSize: 16 }}>A</button>
              <button className={`font-btn ${fontSize === 2 ? "active" : ""}`} onClick={() => setFontSize(2)} style={{ fontSize: 20 }}>A+</button>
            </div>
          </div>
          <div className="header-sub">{BRIEFING.site.theatre} &mdash; {BRIEFING.site.operation} &mdash; DAY {BRIEFING.site.day}</div>
          <div className="header-sub" style={{ color: "var(--crt-amber)", marginTop: 2 }}>{BRIEFING.site.subhead}</div>
          <div style={{ textAlign: "center", marginTop: 8, fontSize: 32, color: "var(--crt-amber)", fontFamily: "'Share Tech Mono', monospace", textShadow: "0 0 10px #ffaa00, 0 0 20px #ffaa00" }}>
            GRACE PERIOD: {countdownStr}
          </div>
          <Ticker />
        </div>

        <div className="tab-bar">
          <button className={`tab-btn ${activeTab === "briefing" ? "active" : ""}`} onClick={() => setActiveTab("briefing")}>{"⚡"} BRIEFING</button>
          <button className={`tab-btn ${activeTab === "fuel" ? "active" : ""}`} onClick={() => setActiveTab("fuel")}>{"⛽"} FUEL FORECAST</button>
        </div>

        {activeTab === "briefing" && (
          <React.Fragment>
            <LiveRadioPanel />
            <KeyMetrics />
            <div className="status-row">
              <div className="defcon-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>DEFCON ASSESSMENT</div>
                <DefconGauge level={defconLevel} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span style={{ color: defconInfo.color }}>DEFCON {defconLevel}</span>
                  <span style={{ color: defconInfo.color, fontSize: 12 }}>{defconInfo.label}</span>
                </div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>{BRIEFING.site.defconSummary}</div>
              </div>
              <div className="clock-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
                <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{sydneyStr}</div>
                <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: {BRIEFING.site.briefingEpoch}</div>
              </div>
            </div>

            <ThreatMatrix />
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
              <button className="expand-all-btn" onClick={toggleAll}>{allOpen ? "▼ COLLAPSE ALL" : "▶ EXPAND ALL"}</button>
            </div>
            {BRIEFING.sections.map((section) => (
              <Section key={section.id} section={section} isOpen={!!openSections[section.id]} toggle={() => toggleSection(section.id)} />
            ))}
          </React.Fragment>
        )}

        {activeTab === "fuel" && <FuelForecast />}

        <div className="footer-bar">
          <span>OPSCEN v{BRIEFING.site.version} • RETSA GROUP INTELLIGENCE</span>
          <span>CLASSIFICATION: OPEN SOURCE</span>
          <span><span className="blink" style={{ color: "var(--crt-red)" }}>•</span> {BRIEFING.site.liveLabel}</span>
        </div>
        <div className="built-with">
          Originally built in <a href={BRIEFING.links.claudeUrl} target="_blank" rel="noopener">Claude</a>, now run through a Codex-powered workflow by <a href={BRIEFING.links.companyUrl} target="_blank" rel="noopener">RETSA Group</a> • <a href={BRIEFING.links.authorUrl} target="_blank" rel="noopener">@Marcus_Rummler</a> • Fuel outage data via <a href={BRIEFING.links.fuelUrl} target="_blank" rel="noopener">checkpetrol.com.au</a>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OPSCEN />);
</script>
</body>
</html>
