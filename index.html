const { useState, useEffect, useCallback } = React;
const BRIEFING = {"site":{"version":"6.18","title":"OPSCEN v6.18 — Iran Theatre Intelligence Briefing","theatre":"IRAN THEATRE INTELLIGENCE BRIEFING","operation":"OPERATION EPIC FURY","day":38,"subhead":"POWER PLANT DAY / BRIDGE DAY — WED APR 8 AEST DEADLINE — HORMUZ STILL DISTORTED","briefingEpoch":"06-APR-2026 0930 AEST","deadlineUtc":"2026-04-07T00:00:00.000Z","defconLevel":3,"defconSummary":"POWER PLANT DAY / BRIDGE DAY • CREW MEMBER RESCUED • HORMUZ DEADLINE","liveLabel":"LIVE"},"meta":{"description":"Day 38. Trump says Tuesday will be 'Power Plant Day' and 'Bridge Day' in Iran if Hormuz is not reopened by 8pm ET on Tuesday, April 7, which is 10am AEST on Wednesday, April 8. Australia remains on fuel watch.","ogDescription":"Day 38 — Trump keeps the 'Power Plant Day' and 'Bridge Day' threat alive, the rescue of the missing US crew member holds, mediation continues and Australia remains in a stressed but improving fuel position."},"xImagePrompt":{"dateDay":"APR 6, 2026 // DAY 38","headline":"POWER PLANT DAY / BRIDGE DAY","subheadline":"TRUMP SETS 8PM ET TUESDAY DEADLINE. HORMUZ STILL DISTORTED.","bullets":["TRUMP SAYS TUESDAY WILL BE 'POWER PLANT DAY' AND 'BRIDGE DAY' IF HORMUZ IS NOT REOPENED BY 8PM ET.","THE MISSING US CREW MEMBER FROM THE DOWNED F-15 IS NOW REPORTEDLY RESCUED.","AUSTRALIA'S FUEL POSITION IS STILL STRESSED, BUT MORE THAN 50 SHIPS ARE INBOUND."],"status":"ESCALATION LEVEL / STATUS: CRITICAL"},"ticker":["urgent // power plant day / bridge day threat remains live","deadline // 10am aest wednesday, april 8","hormuz // technically open, commercially distorted","us aircrew // missing crew member reportedly rescued","australia fuel // 50+ ships inbound, system still stressed","assessment // defcon 3 pending stronger verified escalation"],"readme":{"repoTitle":"OPSCEN v6.18 — Iran Theatre Intelligence Briefing","tagline":"A real-time military operations centre dashboard tracking the 2026 Iran conflict, originally built in [Claude](https://claude.ai) and now run through a Codex-powered publishing workflow by [RETSA Group](https://retsagroup.com.au).","liveUrl":"https://mrummler17.github.io/operations-centre","whatIsThis":["Rather than flicking between 7 News, 9, ABC and YouTube trying to piece together what's happening with Iran — I run an \"update briefing\" workflow.","It searches the web, refreshes my custom ops centre with today's intel, updates the site, and gives me personalised action items for my business and household.","Two words. Fresh every morning. The news comes to me now."],"features":["CRT military aesthetic — retro-futuristic operations centre design","Two-tab interface — Briefing view + interactive Fuel Depletion Forecast","Key metrics dashboard — quick-reference tiles at top of page","9 collapsible intelligence sections covering all theatres of the conflict","Australian Fuel Forecast module — interactive depletion projections for petrol, diesel, and jet fuel with scenario presets and adjustable parameters","Live system clock (Sydney + UTC)","DEFCON gauge with visual assessment","Multi-theatre threat matrix — 9 active zones tracked","Scenario analysis with probability-weighted forecasts","Australian-specific sections — ASX 200, RBA rate impacts, fuel crisis monitoring","UPDATED badges showing what changed since last briefing"],"currentBriefing":["Trump says Tuesday will be 'Power Plant Day' and 'Bridge Day' in Iran if Hormuz is not reopened by 8pm ET on Tuesday, April 7.","The missing US crew member from the downed F-15 is now reportedly rescued after a firefight inside Iran.","Tehran rejected the ultimatum as imbalanced and says mediated contact does not equal surrender.","For Sydney, that deadline lands at about 10am AEST on Wednesday, April 8, 2026.","Hormuz remains technically open but commercially distorted, with shipping risk still doing most of the damage.","Oil is still elevated and headline-sensitive, with global markets trading every new signal around shipping and escalation.","Lebanon remains one of the most dangerous spillover fronts, with the civilian toll still climbing.","Australia's fuel picture is stressed but improving, with fewer outages reported and more than 50 ships inbound.","The working outlook is still coercion plus mediation, not a clean ceasefire.","The next hard trigger is whether the deadline passes quietly or turns into another infrastructure strike cycle."],"howItWorks":["I run \"update briefing\" against the structured briefing file","The workflow searches the web across multiple sources","It refreshes the dashboard and README from the latest data","I preview the output locally and publish in one command","I also get a ready-to-post X image prompt"],"tech":"Single self-contained HTML file. React 18 via CDN. Structured JSON briefing data. Local preview and one-command publish. Zero runtime dependencies.","author":{"name":"Marcus Rummler","xUrl":"https://x.com/Marcus_Rummler","company":"RETSA Group","companyUrl":"https://retsagroup.com.au","bio":"Founder, [RETSA Group](https://retsagroup.com.au) — Instructional design & AI-powered tech solutions.","note":"I can't code. I've never been able to code. But I've shipped a SaaS product and built a military ops centre. All with AI."},"license":"MIT"},"keyMetrics":[{"label":"WAR DAY","value":"38","color":"var(--crt-red)"},{"label":"DEADLINE","value":"APR 8","color":"var(--crt-amber)","delta":"10AM AEST","deltaColor":"#ffaa00"},{"label":"HORMUZ","value":"OPEN?","color":"var(--crt-red)","delta":"TRAFFIC DISTORTED","deltaColor":"#ff4400"},{"label":"TRUMP","value":"ESCALATES","color":"var(--crt-red)","delta":"POWER + BRIDGE DAY","deltaColor":"#ff4400"},{"label":"US CREW","value":"RESCUED","color":"var(--crt-cyan)","delta":"AFTER FIREFIGHT","deltaColor":"#00ffcc"},{"label":"LEBANON","value":"1.4K+","color":"var(--crt-amber)","delta":"1M DISPLACED","deltaColor":"#ffaa00"},{"label":"LEAD SCENARIO","value":"STANDOFF","color":"var(--crt-amber)","delta":"40%","deltaColor":"#ffaa00"},{"label":"STRIKE CYCLE","value":"30%","color":"var(--crt-cyan)","delta":"INFRA THREAT","deltaColor":"#ffaa00"}],"threatMatrix":[{"theatre":"IRAN (MAINLAND)","level":"CRITICAL","color":"#ff0000"},{"theatre":"STRAIT OF HORMUZ","level":"CRITICAL","color":"#ff0000"},{"theatre":"ISRAEL (HOME)","level":"SEVERE","color":"#ff4400"},{"theatre":"LEBANON","level":"SEVERE","color":"#ff4400"},{"theatre":"YEMEN/HOUTHIS","level":"SEVERE","color":"#ff4400"},{"theatre":"GULF STATES","level":"HIGH","color":"#ffaa00"},{"theatre":"GLOBAL ECON","level":"HIGH","color":"#ffaa00"},{"theatre":"NUCLEAR","level":"HIGH","color":"#ffaa00"},{"theatre":"AUSTRALIA","level":"ELEVATED","color":"#cccc00"},{"theatre":"IRAQ/PROXIES","level":"ELEVATED","color":"#cccc00"}],"sections":[{"id":"sitrep","title":"SITUATION REPORT","icon":"⚡","content":{"heading":"DAY 38 -- POWER PLANT DAY / BRIDGE DAY THREAT / WEDNESDAY AEST DEADLINE","lines":["[!] TRUMP KEPT THE THREAT alive: he posted that Tuesday will be 'Power Plant Day' and 'Bridge Day' in Iran if the Strait of Hormuz is not reopened.","THE SPECIFIC DEADLINE now being reported is 8pm ET on Tuesday, April 7. For Sydney, that is about 10am AEST on Wednesday, April 8.","THE MISSING US CREW MEMBER from the downed F-15 is now reportedly rescued after a firefight, removing one of the most politically sensitive open threads from the weekend.","TEHRAN REJECTED THE ULTIMATUM and says mediated contact is not the same thing as accepting US terms.","MEDIATION STILL EXISTS through countries including Pakistan, Turkey and Egypt, which keeps a narrow off-ramp alive even as rhetoric hardens.","THE STRAIT REMAINS TECHNICALLY OPEN but commercially distorted. The market still cares more about risk and interference than legal navigability.","WASHINGTON'S PUBLIC POSTURE is now less about a broad surrender timeline and more about forcing a near-term shipping outcome through an explicit infrastructure threat.","MARKETS REMAIN HEADLINE-DRIVEN, but the overnight shift was more about renewed coercion than fresh panic.","THE HUMAN COST CONTINUES TO RISE across multiple fronts even as the focus swings back to Hormuz and infrastructure threats.","WORKING JUDGMENT: the crisis has not resolved, but it has shifted from the missing-crew drama back to the deadline and what comes after it."]}},{"id":"kinetic","title":"KINETIC OPERATIONS","icon":"🎯","content":{"heading":"AIR CAMPAIGN CONTINUES / RESCUE OPERATION COMPLETED / STRIKE TEMPO STILL HIGH","lines":["WASHINGTON HAS PUBLICLY ACKNOWLEDGED losing two warplanes during the Iran campaign. That keeps the air war costly and politically visible.","THE MISSING CREW MEMBER is now reportedly rescued, which closes a major tactical and political loose end from the downing of the F-15.","IRANIAN AIR DEFENCES are still contesting the skies enough to disrupt assumptions of complete allied air dominance.","STRIKE OPERATIONS CONTINUE across Iranian military and infrastructure targets even while mediation channels stay active.","THE KEY MILITARY SIGNAL is that neither side is acting like a ceasefire is imminent; force is still being used to shape the negotiating table.","IRAN'S WARNING TO THE GULF REMAINS IN PLACE: attacks on southern coastal infrastructure could trigger much wider maritime disruption.","ISRAEL'S NORTHERN FRONT REMAINS ACTIVE, forcing resources to be split between Iran, Lebanon and home-defence tasks.","COMMERCIAL AVIATION AND SHIPPING remain under stress because the military picture still points to escalation risk, not stabilisation.","EACH FRESH LOSS OR STRIKE now has outsized narrative impact because both camps are trying to prove momentum without conceding vulnerability.","WORKING JUDGMENT: the kinetic phase is still driving the diplomatic phase, not the other way around."]}},{"id":"iran_response","title":"IRANIAN RETALIATION","icon":"🚀","content":{"heading":"IRAN REJECTS THE ULTIMATUM BUT MEDIATED CONTACT STILL EXISTS","lines":["IRAN'S OFFICIAL LINE: the ultimatum is hostile and imbalanced, and the US is misrepresenting mediated contact as capitulation.","AT THE SAME TIME, Iranian officials have acknowledged receiving US points through intermediaries. The channel still exists even if the public framing is hostile.","FOREIGN MINISTER ARAQCHI has signalled that trust for direct talks is close to zero, which is posture as much as substance.","IRAN CONTINUES TO USE DUAL-TRACK MESSAGING: public defiance for domestic and regional audiences, quiet message-passing to avoid strategic isolation.","THE REGIME IS TRYING TO SHOW it can absorb pressure, reject humiliation and still keep a pathway open if the military balance worsens.","IRAN'S STRAIT THREAT STILL MATTERS because every denial of talks raises the odds that shipping pressure is used as leverage instead.","PUBLIC DENIAL DOES NOT EQUAL NO CONTACT. For the dashboard, the better reading is 'mediated diplomacy under maximal coercion'.","THE COST OF MISREADING THIS is high: markets are reacting to headline rhetoric while the actual signal is buried in intermediary traffic.","IF THE MONDAY DEADLINE PASSES without visible progress, Tehran's public posture suggests it will blame Washington and double down on deterrence.","WORKING JUDGMENT: diplomacy is alive, but only through deniable channels and under heavy military pressure."]}},{"id":"lebanon","title":"LEBANON / HEZBOLLAH FRONT","icon":"🔥","content":{"heading":"LEBANON FRONT STILL BURNING / 1,400+ DEAD / 1M DISPLACED","lines":["LEBANON'S HEALTH MINISTRY TOLL has climbed above 1,400 dead, with roughly 1 million people displaced as strikes continue.","THAT MAKES LEBANON one of the clearest indicators that the wider regional war is not being contained by talk of deadlines or temporary pauses.","ISRAEL IS STILL HITTING Hezbollah-linked targets while the northern front remains live enough to complicate any broader de-escalation package.","ANY SERIOUS DEAL STILL HAS TO ANSWER the Lebanon question, because Tehran keeps tying regional de-escalation to all fronts, not just Iran's mainland.","THE HUMANITARIAN COST here is no longer a secondary theatre issue; it is one of the main political costs of prolonging the war.","EUROPEAN STATES are increasingly focused on spillover risks from Lebanon through migration, shipping and domestic security pressure.","THE LONGER THIS FRONT STAYS HOT, the harder it becomes to market any partial ceasefire as a genuine stabilisation plan.","LEBANON REMAINS A NEGOTIATION SPOILER: even if US-Iran contact improves, the proxy fronts can still break momentum.","WORKING JUDGMENT: this front is still escalation-prone and underpriced in political messaging.","BOTTOM LINE: the northern theatre remains one of the main reasons a clean ceasefire is unlikely in the immediate term."]}},{"id":"hormuz","title":"STRAIT OF HORMUZ","icon":"🚢","content":{"heading":"DEADLINE EXTENDS INTO WEDNESDAY AEST / STRAIT STILL DISTORTED / TIMING CLARIFIED","lines":["THE CENTRAL TIMER NOW is 8pm ET on Tuesday, April 7 in the US. For Sydney, that is about 10am AEST on Wednesday, April 8.","HORMUZ IS STILL BEST DESCRIBED as physically open but commercially choked: ships can move, but many operators still judge the risk profile as unacceptable.","IRANIAN INTERFERENCE, INSURANCE COSTS and the threat of mining keep the strait operating below anything resembling normal conditions.","THIS IS WHY OIL HASN'T NORMALISED even on diplomacy headlines: the market still sees fragile access, not restored confidence.","MEDIATORS ARE TRYING TO BUY TIME, but the shipping picture says the private channel has not yet delivered operational relief.","THE LONGER THE DEADLINE HANGS unresolved, the more likely importers keep rerouting, delaying cargoes or paying crisis pricing.","FOR AUSTRALIA, THE STRAIT QUESTION matters less as a legal status issue and more as a shipping-risk issue. Cargo certainty is what counts.","A TRUE DE-ESCALATION SIGNAL WOULD BE visible commercial normalisation, not just political statements. That has not happened yet.","IF THE DEADLINE P function useClock() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  return now;
}

function formatSydneyTime(date) {
  const formatter = new Intl.DateTimeFormat("en-AU", {
    timeZone: "Australia/Sydney",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false,
    timeZoneName: "short",
  });
  const parts = formatter.formatToParts(date);
  const get = (type) => parts.find((part) => part.type === type)?.value || "";
  return get("year") + "-" + get("month") + "-" + get("day") + " " + get("hour") + ":" + get("minute") + ":" + get("second") + " " + get("timeZoneName");
}

function formatUtcTime(date) {
  return date.toISOString().replace("T", " ").slice(0, 19) + "Z";
}

const FUEL_BASE_DATE = new Date(BRIEFING.fuelModule.baseDate);
const FUEL_STOCKS_ML = BRIEFING.fuelModule.stocksMl;
const FUEL_DAILY_ML = BRIEFING.fuelModule.dailyMl;
const FUEL_MSO_ML = BRIEFING.fuelModule.msoMl;
const FUEL_SCENARIOS = BRIEFING.fuelModule.scenarios;

function projectFuel(params) {
  const importFactor = params.imports / 100;
  const data = [];
  const stocks = { ...FUEL_STOCKS_ML };
  const reservePerDay = {
    petrol: params.reserve ? FUEL_MSO_ML.petrol / 21 : 0,
    diesel: params.reserve ? FUEL_MSO_ML.diesel / 21 : 0,
    jet: 0,
  };
  const dryDays = { petrol: null, diesel: null, jet: null };

  for (let day = 0; day <= 120; day += 1) {
    data.push({
      day,
      date: new Date(FUEL_BASE_DATE.getTime() + day * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" }),
      petrol: Math.max(0, stocks.petrol),
      diesel: Math.max(0, stocks.diesel),
      jet: Math.max(0, stocks.jet),
    });

    ["petrol", "diesel", "jet"].forEach((fuel) => {
      const consumption = FUEL_DAILY_ML[fuel] * params.demand;
      const imports = FUEL_DAILY_ML[fuel] * importFactor;
      const refineryBoost = fuel === "petrol" && params.refBoost ? 3.3 : 0;
      const reserveRelease = day >= 7 && day < 28 ? reservePerDay[fuel] : 0;

      stocks[fuel] = stocks[fuel] - consumption + imports + refineryBoost + reserveRelease;

      if (stocks[fuel] <= 0 && dryDays[fuel] === null) {
        dryDays[fuel] = day;
        stocks[fuel] = 0;
      }
    });
  }

  return { data, dryDays };
}

function fuelDaysColor(days) {
  if (days <= 7) return "var(--crt-red)";
  if (days <= 14) return "var(--crt-amber)";
  return "var(--crt-green)";
}

function fuelStatus(daysUntilEmpty, depleted) {
  if (depleted) return { text: "DEPLETED", color: "var(--crt-red)", bg: "rgba(255,50,50,0.15)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 7) return { text: "EMERGENCY", color: "var(--crt-red)", bg: "rgba(255,50,50,0.1)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 14) return { text: "RATIONING LIKELY", color: "var(--crt-amber)", bg: "rgba(255,170,0,0.1)", border: "var(--crt-amber)" };
  return { text: "MONITORING", color: "var(--crt-green)", bg: "rgba(50,255,50,0.05)", border: "var(--crt-green)" };
}

function FuelForecast() {
  const [demand, setDemand] = useState(FUEL_SCENARIOS.current.demand);
  const [imports, setImports] = useState(FUEL_SCENARIOS.current.imports);
  const [refBoost, setRefBoost] = useState(FUEL_SCENARIOS.current.refBoost);
  const [reserve, setReserve] = useState(FUEL_SCENARIOS.current.reserve);
  const [preset, setPreset] = useState("current");

  function applyPreset(key) {
    const scenario = FUEL_SCENARIOS[key];
    setDemand(scenario.demand);
    setImports(scenario.imports);
    setRefBoost(scenario.refBoost);
    setReserve(scenario.reserve);
    setPreset(key);
  }

  const result = projectFuel({ demand, imports, refBoost, reserve });
  const chartData = result.data;
  const dryDays = result.dryDays;
  const width = 900;
  const height = 300;
  const paddingLeft = 55;
  const paddingRight = 15;
  const paddingTop = 15;
  const paddingBottom = 35;
  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;
  const maxValue = Math.max(FUEL_STOCKS_ML.petrol, FUEL_STOCKS_ML.diesel, FUEL_STOCKS_ML.jet) * 1.05;
  const fuels = [
    { name: "PETROL", key: "petrol", color: "#33ff33" },
    { name: "DIESEL", key: "diesel", color: "#ff6600" },
    { name: "JET FUEL", key: "jet", color: "#00ffcc" },
  ];

  function seriesPath(key) {
    return chartData.map((point, index) => {
      const x = paddingLeft + (index / 120) * plotWidth;
      const y = paddingTop + plotHeight - (point[key] / maxValue) * plotHeight;
      return `${index === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  function areaPath(key) {
    return `${seriesPath(key)} L${paddingLeft + plotWidth},${paddingTop + plotHeight} L${paddingLeft},${paddingTop + plotHeight} Z`;
  }

  function yPosition(value) {
    return paddingTop + plotHeight - (value / maxValue) * plotHeight;
  }

  return (
    <div>
      <div className="countdown-row">
        {fuels.map((fuel) => {
          const depleted = dryDays[fuel.key] !== null;
          const daysUntilEmpty = depleted ? dryDays[fuel.key] : 120;
          const depletionDate = depleted
            ? new Date(FUEL_BASE_DATE.getTime() + dryDays[fuel.key] * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" })
            : "120+ DAYS";
          const status = fuelStatus(daysUntilEmpty, depleted);

          return (
            <div key={fuel.key} className="cd-card">
              <div className="cd-label">{fuel.name}</div>
              <div className="cd-value" style={{ color: depleted ? "var(--crt-red)" : fuelDaysColor(daysUntilEmpty) }}>
                {depleted ? daysUntilEmpty : daysUntilEmpty >= 120 ? "120+" : daysUntilEmpty}
              </div>
              <div className="cd-sub">DAYS UNTIL DEPLETION</div>
              <div className="cd-sub" style={{ color: depleted ? "var(--crt-red)" : "var(--crt-dim)", marginTop: 2 }}>
                {depleted ? `DRY: ${depletionDate}` : depletionDate}
              </div>
              <div className="cd-status" style={{ color: status.color, background: status.bg, border: `1px solid ${status.border}` }}>
                {status.text}
              </div>
            </div>
          );
        })}
      </div>

      <div className="presets">
        {Object.entries(FUEL_SCENARIOS).map(([key, scenario]) => (
          <button
            key={key}
            className={`preset-btn ${preset === key ? "active" : ""}`}
            style={{ border: `1px solid ${scenario.color}`, color: scenario.color }}
            onClick={() => applyPreset(key)}
          >
            {scenario.name}
          </button>
        ))}
      </div>

      <div className="ctrl-box">
        <div className="ctrl-title">INTERACTIVE PARAMETERS</div>
        <div className="ctrl-grid">
          <div className="ctrl-item">
            <label>DEMAND MULTIPLIER <span className="ctrl-val">{demand.toFixed(1)}x</span></label>
            <input type="range" min="0.8" max="2.5" step="0.1" value={demand} onChange={(event) => { setDemand(parseFloat(event.target.value)); setPreset(null); }} />
          </div>
          <div className="ctrl-item">
            <label>IMPORT FLOW RATE <span className="ctrl-val">{imports}%</span></label>
            <input type="range" min="0" max="100" step="5" value={imports} onChange={(event) => { setImports(parseInt(event.target.value, 10)); setPreset(null); }} />
          </div>
        </div>
        <div className="toggle-row">
          <button className={`toggle-btn ${refBoost ? "on" : ""}`} onClick={() => { setRefBoost(!refBoost); setPreset(null); }}>
            {(refBoost ? "[ON]" : "[OFF]") + " SULPHUR WAIVER (+3.3 ML/day petrol)"}
          </button>
          <button className={`toggle-btn ${reserve ? "on" : ""}`} onClick={() => { setReserve(!reserve); setPreset(null); }}>
            {(reserve ? "[ON]" : "[OFF]") + " MSO RESERVE RELEASE (762 ML)"}
          </button>
        </div>
      </div>

      <div className="chart-panel">
        <div className="chart-title">DEPLETION CURVES - MILLION LITRES REMAINING</div>
        <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", fontFamily: "'Share Tech Mono', monospace" }}>
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <line key={`grid-${fraction}`} x1={paddingLeft} y1={y} x2={paddingLeft + plotWidth} y2={y} stroke="#1a3a1a" strokeDasharray="3 3" />;
          })}
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <text key={`label-${fraction}`} x={paddingLeft - 5} y={y + 4} textAnchor="end" fill="#3a7a3a" fontSize="10">{(maxValue * fraction / 1000).toFixed(1)}k</text>;
          })}
          {[0, 30, 60, 90, 120].map((day) => {
            const x = paddingLeft + (day / 120) * plotWidth;

          <line x1={paddingLeft} y1={yPosition(7 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(7 * FUEL_DAILY_ML.diesel)} stroke="#ff3333" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(7 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ff3333" fontSize="9">EMERGENCY 7d</text>

          <path d={seriesPath("petrol")} fill="none" stroke="#33ff33" strokeWidth="2" />

          <line x1={paddingLeft} y1={paddingTop} x2={paddingLeft} y2={paddingTop + plotHeight} stroke="#3a7a3a" />

        </svg>
        <div className="legend-row">
          <div className="legend-item"><div className="legend-dot" style={{ background: "#33ff33" }} /> PETROL</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#ff6600" }} /> DIESEL (PRIORITY)</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#00ffcc" }} /> JET FUEL</div>
          <div className="legend-item" style={{ color: "#ffaa00" }}>--- RATIONING (14d)</div>
          <div className="legend-item" style={{ color: "#ff3333" }}>--- EMERGENCY (7d)</div>
        </div>
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">LIVE OUTAGE DATA (via checkpetrol.com.au)</div>
        {BRIEFING.fuelModule.liveContext.map((line) => <div key={line.text} className={`ctx-line ${line.variant === "default" ? "" : line.variant}`}>{line.text}</div>)}
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">FORECAST DATA SOURCES</div>
        {BRIEFING.fuelModule.sourceNotes.map((note) => <div key={note} className="ctx-line">{note}</div>)}
      </div>
    </div>
  );
}

function OPSCEN() {
  const clock = useClock();
  const [openSections, setOpenSections] = useState({ sitrep: true });
  const [allOpen, setAllOpen] = useState(false);
  const [fontSize, setFontSize] = useState(1);
  const [activeTab, setActiveTab] = useState("briefing");
  const fontScale = [14, 16, 19][fontSize];
  const defconLevel = BRIEFING.site.defconLevel;
  const defconInfo = DEFCON_LEVELS.find((item) => item.level === defconLevel);
  const utcStr = formatUtcTime(clock);
  const sydneyStr = formatSydneyTime(clock);
  const deadlineUtc = new Date(BRIEFING.site.deadlineUtc);
  const msLeft = deadlineUtc - clock;
  const daysLeft = Math.max(0, Math.ceil(msLeft / 86400000));
  const countdownStr = msLeft > 0 ? `${daysLeft} DAY${daysLeft !== 1 ? "S" : ""} REMAINING` : "EXPIRED";

  const toggleSection = useCallback((id) => {
    setOpenSections((previous) => ({ ...previous, [id]: !previous[id] }));
  }, []);

  const toggleAll = useCallback(() => {
    const nextState = !allOpen;
    setAllOpen(nextState);
    const nextSections = {};
    BRIEFING.sections.forEach((section) => {
      nextSections[section.id] = nextState;
    });
    setOpenSections(nextSections);
  }, [allOpen]);

  return (
    <React.Fragment>
      <div className="scanlines" />
      <div className="opscen-container" style={{ fontSize: fontScale }}>
        <div className="header-bar">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div className="header-title crt-glow">{"◤"} OPSCEN v{BRIEFING.site.version} {"◢"}</div>
            <div className="font-controls">
              <button className={`font-btn ${fontSize === 0 ? "active" : ""}`} onClick={() => setFontSize(0)} style={{ fontSize: 13 }}>A-</button>
              <button className={`font-btn ${fontSize === 1 ? "active" : ""}`} onClick={() => setFontSize(1)} style={{ fontSize: 16 }}>A</button>
              <button className={`font-btn ${fontSize === 2 ? "active" : ""}`} onClick={() => setFontSize(2)} style={{ fontSize: 20 }}>A+</button>
            </div>
          </div>
          <div className="header-sub">{BRIEFING.site.theatre} &mdash; {BRIEFING.site.operation} &mdash; DAY {BRIEFING.site.day}</div>
          <div className="header-sub" style={{ color: "var(--crt-amber)", marginTop: 2 }}>{BRIEFING.site.subhead}</div>
          <div style={{ textAlign: "center", marginTop: 8, fontSize: 32, color: "var(--crt-amber)", fontFamily: "'Share Tech Mono', monospace", textShadow: "0 0 10px #ffaa00, 0 0 20px #ffaa00" }}>
            GRACE PERIOD: {countdownStr}
          </div>
          <Ticker />
        </div>

        <div className="tab-bar">
          <button className={`tab-btn ${activeTab === "briefing" ? "active" : ""}`} onClick={() => setActiveTab("briefing")}>{"⚡"} BRIEFING</button>
          <button className={`tab-btn ${activeTab === "fuel" ? "active" : ""}`} onClick={() => setActiveTab("fuel")}>{"⛽"} FUEL FORECAST</button>
        </div>

        {activeTab === "briefing" && (
          <React.Fragment>
            <KeyMetrics />
            <div className="status-row">
              <div className="defcon-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>DEFCON ASSESSMENT</div>
                <DefconGauge level={defconLevel} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span style={{ color: defconInfo.color }}>DEFCON {defconLevel}</span>
                  <span style={{ color: defconInfo.color, fontSize: 12 }}>{defconInfo.label}</span>
                </div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>{BRIEFING.site.defconSummary}</div>
              </div>
              <div className="clock-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
                <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{sydneyStr}</div>
                <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: {BRIEFING.site.briefingEpoch}</div>
              </div>
            </div>

            <ThreatMatrix />
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
              <button className="expand-all-btn" onClick={toggleAll}>{allOpen ? "▼ COLLAPSE ALL" : "▶ EXPAND ALL"}</button>
            </div>
            {BRIEFING.sections.map((section) => (
              <Section key={section.id} section={section} isOpen={!!openSections[section.id]} toggle={() => toggleSection(section.id)} />
            ))}
          </React.Fragment>
        )}

        {activeTab === "fuel" && <FuelForecast />}

        <div className="footer-bar">
          <span>OPSCEN v{BRIEFING.site.version} • RETSA GROUP INTELLIGENCE</span>
          <span>CLASSIFICATION: OPEN SOURCE</span>
          <span><span className="blink" style={{ color: "var(--crt-red)" }}>•</span> {BRIEFING.site.liveLabel}</span>
        </div>
        <div className="built-with">
          Originally built in <a href={BRIEFING.links.claudeUrl} target="_blank" rel="noopener">Claude</a>, now run through a Codex-powered workflow by <a href={BRIEFING.links.companyUrl} target="_blank" rel="noopener">RETSA Group</a> • <a href={BRIEFING.links.authorUrl} target="_blank" rel="noopener">@Marcus_Rummler</a> • Fuel outage data via <a href={BRIEFING.links.fuelUrl} target="_blank" rel="noopener">checkpetrol.com.au</a>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OPSCEN />);
</script>
</body>
</html>
