* { box-sizing: border-box; margin: 0; padding: 0; }

:root {

  --crt-border: #1a3a1a;
  --crt-text: #22cc22;

body {
  background: var(--crt-bg);
  color: var(--crt-text);
  font-family: 'VT323', monospace;
  overflow-x: hidden;
}

.scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--crt-scanline) 2px, var(--crt-scanline) 4px);
}

.crt-glow { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor; }

.opscen-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px;
  min-height: 100vh;
}

.header-bar {
  border: 1px solid var(--crt-green);
  padding: 12px 16px;
  margin-bottom: 12px;
  background: linear-gradient(180deg, rgba(0,40,0,0.3) 0%, var(--crt-bg) 100%);
  position: relative;
  overflow: hidden;
}

.header-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: var(--crt-green);
  box-shadow: 0 0 8px var(--crt-green);
}

.header-title {
  font-size: 28px;
  letter-spacing: 6px;
  color: var(--crt-green);
  text-align: center;
}

.header-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  color: var(--crt-amber);
  text-align: center;
  margin-top: 4px;
  letter-spacing: 2px;
}

.status-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.defcon-panel, .clock-panel {
  border: 1px solid var(--crt-border);
  padding: 10px 14px;
  background: var(--crt-panel);
  flex: 1;
  min-width: 200px;
}

.defcon-gauge {
  display: flex;
  gap: 2px;
  margin: 8px 0;
  height: 20px;
}

.defcon-seg {
  flex: 1;
  opacity: 0.2;
  transition: opacity 0.3s;
}

.defcon-seg.active {
  opacity: 1;
  box-shadow: 0 0 6px currentColor;
}

.threat-matrix {
  border: 1px solid var(--crt-border);
  padding: 10px;
  margin-bottom: 12px;
  background: var(--crt-panel);
}

.threat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
  margin-top: 8px;
}

.threat-cell {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid #1a2a1a;
  font-size: 14px;
  background: rgba(0,0,0,0.3);
}

.threat-level {
  font-size: 12px;
  padding: 1px 6px;
  font-weight: bold;
  letter-spacing: 1px;
}

.section-block {
  border: 1px solid var(--crt-border);
  margin-bottom: 6px;
  background: var(--crt-panel);
  transition: border-color 0.2s;
}

.section-block:hover { border-color: var(--crt-dim); }

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--crt-green);
  border-bottom: 1px solid transparent;
  transition: all 0.2s;
}

.section-header:hover { background: rgba(0, 60, 0, 0.15); }

.section-header.open {
  border-bottom: 1px solid var(--crt-border);
  color: var(--crt-amber);
}

.section-chevron {
  font-size: 14px;
  transition: transform 0.2s;
  margin-left: auto;
  color: var(--crt-dim);
}

.section-chevron.open {
  transform: rotate(90deg);
  color: var(--crt-amber);
}

.section-body {
  padding: 10px 14px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-heading {
  font-size: 15px;
  color: var(--crt-cyan);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #0a2a2a;
  letter-spacing: 1px;
}

.intel-line {

  font-size: 13px;
  line-height: 1.6;
  padding: 3px 0 3px 16px;
  position: relative;
  color: #99cc99;
  border-left: 2px solid #1a3a1a;
  margin-bottom: 2px;
}

.intel-line::before {
  content: '\25B8';
  position: absolute;
  left: 4px;
  color: var(--crt-dim);
}

.intel-line.highlight {
  color: var(--crt-amber);
  border-left-color: var(--crt-amber);
}

.intel-line.critical {
  color: var(--crt-red);
  border-left-color: var(--crt-red);
}

.footer-bar {
  border: 1px solid var(--crt-border);
  padding: 8px 14px;
  margin-top: 12px;
  background: var(--crt-panel);

  justify-content: space-between;

  font-size: 13px;
  color: var(--crt-dim);

.blink { animation: blinkAnim 1.2s step-end infinite; }

@keyframes blinkAnim { 50% { opacity: 0; } }

.pulse-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--crt-red);
  animation: pulseDot 1.5s ease-in-out infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes pulseDot {

.delta-badge {

  margin-left: 8px;
  background: rgba(255,100,0,0.15);
  border: 1px solid #ff6600;
  color: #ff9944;

.built-with {

  .threat-grid { grid-template-columns: 1fr; }
  .status-row { flex-direction: column; }
  .opscen-container { padding: 6px; }

function useClock() {
  const [time, setTime] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return time;
}

function DefconGauge({ level }) {
  const segments = 20;
  const activeCount = Math.round(((5 - level) / 4) * segments);
  const colors = ["#4488ff", "#44cc44", "#ffaa00", "#ff4400", "#ff0000"];
  return (
    <div className="defcon-gauge">
      {Array.from({ length: segments }, (_, i) => {
        const colorIdx = Math.min(4, Math.floor((i / segments) * 5));
        return (
          <div key={i} className={"defcon-seg" + (i < activeCount ? " active" : "")}
            style={{ backgroundColor: colors[colorIdx], color: colors[colorIdx] }} />
        );
      })}
    </div>
  );
}

function ThreatMatrix() {
  return (
    <div className="threat-matrix">
      <div style={{ fontSize: 15, letterSpacing: 2, color: "var(--crt-green)" }}>
        &#9670; THREAT MATRIX &mdash; MULTI-THEATRE
      </div>
      <div className="threat-grid">
        {THREAT_MATRIX.map((t) => (
          <div key={t.theatre} className="threat-cell">
            <span>{t.theatre}</span>
            <span className="threat-level" style={{ color: t.color, border: "1px solid " + t.color }}>
              {t.level}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Section({ section, isOpen, toggle }) {
  const hasDelta = ["sitrep","kinetic","iran_response","lebanon","hormuz","oil","asx","fuel_au","scenarios","actions"].includes(section.id);
  return (
    <div className="section-block">
      <div className={"section-header" + (isOpen ? " open" : "")} onClick={toggle}>
        <span>{section.icon}</span>
        <span>{section.title}</span>
        {hasDelta && <span className="delta-badge">UPDATED</span>}
        <span className={"section-chevron" + (isOpen ? " open" : "")}>{"\u25B6"}</span>
      </div>
      {isOpen && (
        <div className="section-body">
          <div className="section-heading">{section.content.heading}</div>
          {section.content.lines.map((line, i) => {
            const isCrit = line.includes("CRITICAL") || line.includes("KIA") || line.includes("killed") || line.includes("crisis");
            const isHL = line.includes("ADVANTAGE") || line.includes("SCENARIO") || line.includes("WATCH") || line.includes("CHANGE SINCE") || line.includes("WILDCARD") || line.includes("NEW FACTOR");
            return (
              <div key={i} className={"intel-line" + (isCrit ? " critical" : isHL ? " highlight" : "")}>
                {line}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function OPSCEN() {
  const clock = useClock();
  const [openSections, setOpenSections] = useState({ sitrep: true });
  const [allOpen, setAllOpen] = useState(false);
  const defconLevel = 3;

    setOpenSections((prev) => ({ ...prev, [id]: !prev[id] }));

    const next = !allOpen;
    setAllOpen(next);
    const state = {};
    SECTIONS.forEach((s) => (state[s.id] = next));
    setOpenSections(state);
  }, [allOpen]);

  const defconInfo = DEFCON_LEVELS.find((d) => d.level === defconLevel);

  const aest = new Date(clock.getTime() + 11 * 3600000);
  const aestStr = aest.toISOString().replace("T", " ").slice(0, 19) + " AEDT";

  return (
    <React.Fragment>
      <div className="scanlines" />
      <div className="opscen-container">
        <div className="header-bar">
          <div className="header-title crt-glow">{"\u25E4"} OPSCEN v5.4 {"\u25E2"}</div>
          <div className="header-sub">OPERATIONS CENTRE &mdash; IRAN THEATRE INTELLIGENCE BRIEFING &mdash; 18 MARCH 2026</div>
          <div className="header-sub" style={{ color: "var(--crt-red)" }}>
            <span className="pulse-dot" />
            CONFLICT DAY 19 &mdash; OPERATION EPIC FURY &mdash; ACTIVE COMBAT OPERATIONS
          </div>
        </div>

        <div className="status-row">
          <div className="defcon-panel">
            <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>DEFCON ASSESSMENT</div>
            <DefconGauge level={defconLevel} />
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
              <span style={{ color: defconInfo.color }}>DEFCON {defconLevel}</span>
              <span style={{ color: defconInfo.color, fontSize: 12 }}>{defconInfo.label}</span>
            </div>
            <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>
              REGIONAL CONFLICT &bull; MULTI-THEATRE &bull; NO NUCLEAR USE (YET)
            </div>
          </div>
          <div className="clock-panel">
            <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
            <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{aestStr}</div>
            <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
            <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: 18-MAR-2026 0800 AEDT</div>
          </div>
        </div>

        <ThreatMatrix />

        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
          <button className="expand-all-btn" onClick={toggleAll}>
            {allOpen ? "\u25BC COLLAPSE ALL" : "\u25B6 EXPAND ALL"}
          </button>
        </div>

        {SECTIONS.map((s) => (
          <Section key={s.id} section={s} isOpen={!!openSections[s.id]} toggle={() => toggle(s.id)} />
        ))}

        <div className="footer-bar">
          <span>OPSCEN v5.4 &bull; RETSA GROUP INTELLIGENCE</span>
          <span>CLASSIFICATION: OPEN SOURCE</span>
          <span><span className="blink" style={{ color: "var(--crt-red)" }}>&bull;</span> LIVE</span>
        </div>

        <div className="built-with">
          Built entirely in <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a> by <a href="https://retsagroup.com.au" target="_blank" rel="noopener">RETSA Group</a> &bull;
          <a href="https://x.com/Marcus_Rummler" target="_blank" rel="noopener">@Marcus_Rummler</a>
        </div>
      </div>
    </React.Fragment>
  );
}
