const BRIEFING = {"site":{"version":"6.27","title":"OPSCEN v6.27 — Iran Theatre Intelligence Briefing","theatre":"IRAN THEATRE INTELLIGENCE BRIEFING","operation":"OPERATION EPIC FURY","day":48,"subhead":"BLOCKADE HOLDS — MEDIATION CONTINUES — GEELONG FIRE HITS FUEL","briefingEpoch":"16-APR-2026 1700 AEST","deadlineUtc":"2026-04-22T00:00:00.000Z","defconLevel":3,"defconSummary":"BLOCKADE ACTIVE • MEDIATION ACTIVE • DEFCON 3 HOLDS","liveLabel":"LIVE"},"meta":{"description":"Day 48. The U.S. blockade remains in force, Pakistani mediation is still trying to restart talks, and the Geelong refinery fire adds fresh Australian fuel stress.","ogDescription":"Day 48 — blockade still active, mediation still tentative, Hormuz still commercially distorted, and Australia now faces a Geelong refinery disruption on top of local outages."},"xImagePrompt":{"dateDay":"APR 16, 2026 // DAY 48","headline":"BLOCKADE HOLDS","subheadline":"MEDIATION CONTINUES. GEELONG FIRE HITS PETROL OUTPUT.","bullets":["AP REPORTING SAYS PAKISTANI MEDIATORS ARE STILL PUSHING FOR MORE U.S.-IRAN TALKS, BUT NO NEW ROUND HAS BEEN FORMALLY SET.","THE U.S. BLOCKADE REMAINS ACTIVE, AND AP REPORTED CENTCOM SAID NO SHIPS GOT PAST IN THE FIRST 48 HOURS WHILE 10 VESSELS TURNED BACK.","AUSTRALIA IS STILL ON FUEL WATCH, AND A FIRE AT VIVA ENERGY'S GEELONG REFINERY HAS NOW HIT PETROL OUTPUT EVEN AS BOWEN SAYS 57 SHIPS ARE INBOUND."],"status":"ESCALATION LEVEL / STATUS: HIGH"},"ticker":["urgent // blockade remains active on day three","mediation // pakistani delegation in tehran seeking more us-iran talks","shipping // ap says centcom reported 10 vessels turned back in first 48 hours","hormuz // passable for some traffic, still commercially distorted","pressure // us shifts toward harsher financial sanctions on iran","australia fuel // geelong refinery fire cuts output rates","outages // check petrol shows 690 stations affected nationally","assessment // defcon 3 holds: coercion active, no verified return to mass strikes"],"readme":{"repoTitle":"OPSCEN v6.27 — Iran Theatre Intelligence Briefing","tagline":"A real-time military operations centre dashboard tracking the 2026 Iran conflict, originally built in [Claude](https://claude.ai) and now run through a Codex-powered publishing workflow by [RETSA Group](https://retsagroup.com.au).","liveUrl":"https://mrummler17.github.io/operations-centre","whatIsThis":["Rather than flicking between 7 News, 9, ABC and YouTube trying to piece together what's happening with Iran — I run an \"update briefing\" workflow.","It searches the web, refreshes my custom ops centre with today's intel, updates the site, and gives me personalised action items for my business and household.","Two words. Fresh every morning. The news comes to me now."],"features":["CRT military aesthetic — retro-futuristic operations centre design","Two-tab interface — Briefing view + interactive Fuel Depletion Forecast","Key metrics dashboard — quick-reference tiles at top of page","9 collapsible intelligence sections covering all theatres of the conflict","Australian Fuel Forecast module — interactive depletion projections for petrol, diesel, and jet fuel with scenario presets and adjustable parameters","Live radio monitor — embedded NPR public audio feed inside the dashboard","Live system clock (Sydney + UTC)","DEFCON gauge with visual assessment","Multi-theatre threat matrix — 9 active zones tracked","Scenario analysis with probability-weighted forecasts","Australian-specific sections — ASX 200, RBA rate impacts, fuel crisis monitoring","UPDATED badges showing what changed since last briefing"],"currentBriefing":["The U.S. blockade of Iranian ports is still active on April 16, 2026, and AP reports Pakistani mediators are still trying to get a second round of U.S.-Iran talks back to Islamabad, but no meeting has been formally locked in.","AP also reports U.S. Central Command said no ships got past the blockade in the first 48 hours and 10 merchant vessels turned around, which keeps the coercive pressure real even though the Strait of Hormuz is not fully shut.","The most important Australia-specific change is the Geelong refinery fire: Fire Rescue Victoria said the blaze was extinguished and that diesel and petrol production were continuing at reduced rates for safety reasons.","Australia remains on fuel watch rather than fuel panic. Bowen's April 13 briefing still points to 38 days of petrol, 31 days of diesel, 28 days of jet fuel and 57 ships inbound, but the domestic refining picture is now weaker than yesterday.","Check Petrol's live outage tracker shows 690 stations affected nationally across 964 fuel-type outages, with overall availability at 96% across 7,498 tracked stations.","The working outlook is still a fragile maritime standoff with live mediation, not a verified return to the heaviest U.S. strike phase and not yet a durable settlement.","The next hard triggers are whether a new Islamabad round is actually scheduled, whether the ceasefire is formally extended before April 22, 2026, and how quickly Geelong output recovers."],"howItWorks":["I run \"update briefing\" against the structured briefing file","The workflow searches the web across multiple sources","It refreshes the dashboard and README from the latest data","I preview the output locally and publish in one command","I also get a ready-to-post X image prompt"],"tech":"Single self-contained HTML file. React 18 via CDN. Structured JSON briefing data. Local preview and one-command publish. Zero runtime dependencies.","author":{"name":"Marcus Rummler","xUrl":"https://x.com/Marcus_Rummler","company":"RETSA Group","companyUrl":"https://retsagroup.com.au","bio":"Founder, [RETSA Group](https://retsagroup.com.au) — Instructional design & AI-powered tech solutions.","note":"I can't code. I've never been able to code. But I've shipped a SaaS product and built a military ops centre. All with AI."},"license":"MIT"},"keyMetrics":[{"label":"WAR DAY","value":"48","color":"var(--crt-red)"},{"label":"DEADLINE","value":"6 DAYS","color":"var(--crt-amber)","delta":"APR 22 WINDOW","deltaColor":"#ffaa00"},{"label":"HORMUZ","value":"OPEN*","color":"var(--crt-amber)","delta":"TRAFFIC DISTORTED","deltaColor":"#ff4400"},{"label":"TALKS","value":"MEDIATION","color":"var(--crt-amber)","delta":"NO DATE SET","deltaColor":"#ffaa00"},{"label":"OIL","value":"~$95","color":"var(--crt-cyan)","delta":"OFF PANIC HIGHS","deltaColor":"#00ffcc"},{"label":"LEBANON","value":"DIRECT TALKS","color":"var(--crt-amber)","delta":"FIGHTING CONTINUES","deltaColor":"#ffaa00"},{"label":"LEAD SCENARIO","value":"MARITIME STANDOFF","color":"var(--crt-amber)","delta":"50%","deltaColor":"#ffaa00"},{"label":"STRIKE CYCLE","value":"30%","color":"var(--crt-amber)","delta":"NO VERIFIED RESUMPTION","deltaColor":"#ffaa00"}],"threatMatrix":[{"theatre":"IRAN (MAINLAND)","level":"SEVERE","color":"#ff4400"},{"theatre":"STRAIT OF HORMUZ","level":"CRITICAL","color":"#ff0000"},{"theatre":"ISRAEL (HOME)","level":"SEVERE","color":"#ff4400"},{"theatre":"LEBANON","level":"SEVERE","color":"#ff4400"},{"theatre":"YEMEN/HOUTHIS","level":"SEVERE","color":"#ff4400"},{"theatre":"GULF STATES","level":"HIGH","color":"#ffaa00"},{"theatre":"GLOBAL ECON","level":"HIGH","color":"#ffaa00"},{"theatre":"NUCLEAR","level":"HIGH","color":"#ffaa00"},{"theatre":"AUSTRALIA","level":"ELEVATED","color":"#cccc00"},{"theatre":"IRAQ/PROXIES","level":"ELEVATED","color":"#cccc00"}],"sections":[{"id":"sitrep","title":"SITUATION REPORT","icon":"⚡","content":{"heading":"DAY 48 -- BLOCKADE HOLDS / MEDIATION CONTINUES / GEELONG FIRE ADDS FUEL STRESS","lines":["[!] THE LEAD VERIFIED CHANGE on April 16 is not a new U.S. strike wave. It is the combination of an active blockade, still-unfinished mediation, and a new Australian refinery disruption.","AP REPORTED on April 15 that Pakistan's army chief met Iranian officials in Tehran to push for another U.S.-Iran round, with the White House saying any resumed in-person talks would very likely return to Islamabad but were not yet decided.","AP ALSO REPORTED U.S. Central Command said no ships got past the blockade in the first 48 hours and 10 merchant vessels complied with U.S. direction to turn around and reenter Iranian waters.","THAT KEEPS THE COERCIVE ELEMENT real even while the diplomatic channel remains open. Public reporting still does not support a clean peace story, but it also does not show a verified return to the heaviest strike phase.","FOR AUSTRALIA, the Geelong refinery fire is now the biggest new domestic complication. It does not by itself prove a national supply break, but it does reduce margin inside an already stressed fuel system.","WORKING JUDGMENT: blockade enforcement is real, mediation remains active but tentative, and the Australia fuel picture is now weaker than yesterday because local refining resilience has taken a hit."]}},{"id":"kinetic","title":"KINETIC OPERATIONS","icon":"🎯","content":{"heading":"NO FRESH VERIFIED MASS-STRIKE CYCLE / MARITIME AND ECONOMIC PRESSURE DOMINATE","lines":["THERE IS STILL NO FRESH VERIFIED PUBLIC REPORTING of a resumed large-scale U.S. bombing cycle against mainland Iran in the last 24 hours.","INSTEAD, AP REPORTING on April 15-16 shows Washington leaning harder on blockade enforcement and economic coercion, with Treasury Secretary Scott Bessent describing secondary sanctions as the financial equivalent of a bombing campaign.","THE MILITARY RISK REMAINS HIGH because blockade enforcement is backed by force and any interception, mining incident or strike on Gulf shipping could restart the air war fast.","FOR THIS PANEL, the important update is continued coercion without verified massed new strikes, not proof of durable de-escalation.","WORKING JUDGMENT: operational tempo remains dangerous, but the center of gravity is still blockade plus sanctions rather than a newly confirmed bombing surge."]}},{"id":"iran_response","title":"IRANIAN RETALIATION","icon":"🚀","content":{"heading":"TEHRAN RESISTS THE BLOCKADE / TALKS CHANNEL STAYS NARROW / CONDITIONS STILL HARD","lines":["AP REPORTED Tehran is still engaging through mediators while publicly rejecting U.S. pressure and keeping hard conditions on any resumed diplomacy.","IRANIAN OFFICIALS said the country is open to discussing the type and level of enrichment, but insists it must continue enrichment based on its own needs.","AT THE SAME TIME, Iranian military voices have threatened to halt regional trade if the U.S. blockade is not lifted, which keeps retaliation risk live even while diplomats work.","THE CURRENT SIGNAL is classic dual-track behaviour: preserve a path to talks, refuse to look cornered, and keep coercive threats in reserve.","WORKING JUDGMENT: Iran is still bargaining under pressure, not capitulating, and the diplomatic channel remains real but very narrow."]}},{"id":"lebanon","title":"LEBANON / HEZBOLLAH FRONT","icon":"🔥","content":{"heading":"DIRECT TALKS OPENED / FIGHTING CONTINUES / PROXY RISK STILL ACTIVE","lines":["AP REPORTED on April 14 that Israel and Lebanon held their first direct diplomatic talks in decades in Washington.","THAT REMAINS a real diplomatic development, but it has not cooled the front yet. AP reported Israeli strikes in southern Lebanon continued on April 15 and killed paramedics as Hezbollah fighting persisted.","FOR THE WIDER IRAN THEATRE, Lebanon remains the clearest reminder that regional spillover is still active even while separate negotiation tracks reopen.","WORKING JUDGMENT: the Washington channel matters, but Lebanon is still a live conflict front rather than a settled de-escalation success."]}},{"id":"hormuz","title":"STRAIT OF HORMUZ","icon":"🚢","content":{"heading":"BLOCKADE ACTIVE / SOME TRANSIT CONTINUES / COMMERCIAL NORMALITY STILL ABSENT","lines":["THE BLOCKADE TARGETS IRANIAN PORT TRAFFIC, not every ship in the Strait of Hormuz. That means the waterway is still physically passable for some non-Iran traffic.","BUT AP AND REUTERS-ATTRIBUTED SHIPPING REPORT function useClock() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  return now;
}

function formatSydneyTime(date) {
  const formatter = new Intl.DateTimeFormat("en-AU", {
    timeZone: "Australia/Sydney",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false,
    timeZoneName: "short",
  });
  const parts = formatter.formatToParts(date);
  const get = (type) => parts.find((part) => part.type === type)?.value || "";
  return get("year") + "-" + get("month") + "-" + get("day") + " " + get("hour") + ":" + get("minute") + ":" + get("second") + " " + get("timeZoneName");
}

function formatUtcTime(date) {
  return date.toISOString().replace("T", " ").slice(0, 19) + "Z";
}

const FUEL_BASE_DATE = new Date(BRIEFING.fuelModule.baseDate);
const FUEL_STOCKS_ML = BRIEFING.fuelModule.stocksMl;
const FUEL_DAILY_ML = BRIEFING.fuelModule.dailyMl;
const FUEL_MSO_ML = BRIEFING.fuelModule.msoMl;
const FUEL_SCENARIOS = BRIEFING.fuelModule.scenarios;

function projectFuel(params) {
  const importFactor = params.imports / 100;
  const data = [];
  const stocks = { ...FUEL_STOCKS_ML };
  const reservePerDay = {
    petrol: params.reserve ? FUEL_MSO_ML.petrol / 21 : 0,
    diesel: params.reserve ? FUEL_MSO_ML.diesel / 21 : 0,
    jet: 0,
  };
  const dryDays = { petrol: null, diesel: null, jet: null };

  for (let day = 0; day <= 120; day += 1) {
    data.push({
      day,
      date: new Date(FUEL_BASE_DATE.getTime() + day * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" }),
      petrol: Math.max(0, stocks.petrol),
      diesel: Math.max(0, stocks.diesel),
      jet: Math.max(0, stocks.jet),
    });

    ["petrol", "diesel", "jet"].forEach((fuel) => {
      const consumption = FUEL_DAILY_ML[fuel] * params.demand;
      const imports = FUEL_DAILY_ML[fuel] * importFactor;
      const refineryBoost = fuel === "petrol" && params.refBoost ? 3.3 : 0;
      const reserveRelease = day >= 7 && day < 28 ? reservePerDay[fuel] : 0;

      stocks[fuel] = stocks[fuel] - consumption + imports + refineryBoost + reserveRelease;

      if (stocks[fuel] <= 0 && dryDays[fuel] === null) {
        dryDays[fuel] = day;
        stocks[fuel] = 0;
      }
    });
  }

  return { data, dryDays };
}

function fuelDaysColor(days) {
  if (days <= 7) return "var(--crt-red)";
  if (days <= 14) return "var(--crt-amber)";
  return "var(--crt-green)";
}

function fuelStatus(daysUntilEmpty, depleted) {
  if (depleted) return { text: "DEPLETED", color: "var(--crt-red)", bg: "rgba(255,50,50,0.15)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 7) return { text: "EMERGENCY", color: "var(--crt-red)", bg: "rgba(255,50,50,0.1)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 14) return { text: "RATIONING LIKELY", color: "var(--crt-amber)", bg: "rgba(255,170,0,0.1)", border: "var(--crt-amber)" };
  return { text: "MONITORING", color: "var(--crt-green)", bg: "rgba(50,255,50,0.05)", border: "var(--crt-green)" };
}

function FuelForecast() {
  const [demand, setDemand] = useState(FUEL_SCENARIOS.current.demand);
  const [imports, setImports] = useState(FUEL_SCENARIOS.current.imports);
  const [refBoost, setRefBoost] = useState(FUEL_SCENARIOS.current.refBoost);
  const [reserve, setReserve] = useState(FUEL_SCENARIOS.current.reserve);
  const [preset, setPreset] = useState("current");

  function applyPreset(key) {
    const scenario = FUEL_SCENARIOS[key];
    setDemand(scenario.demand);
    setImports(scenario.imports);
    setRefBoost(scenario.refBoost);
    setReserve(scenario.reserve);
    setPreset(key);
  }

  const result = projectFuel({ demand, imports, refBoost, reserve });
  const chartData = result.data;
  const dryDays = result.dryDays;
  const width = 900;
  const height = 300;
  const paddingLeft = 55;
  const paddingRight = 15;
  const paddingTop = 15;
  const paddingBottom = 35;
  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;
  const maxValue = Math.max(FUEL_STOCKS_ML.petrol, FUEL_STOCKS_ML.diesel, FUEL_STOCKS_ML.jet) * 1.05;
  const fuels = [
    { name: "PETROL", key: "petrol", color: "#33ff33" },
    { name: "DIESEL", key: "diesel", color: "#ff6600" },
    { name: "JET FUEL", key: "jet", color: "#00ffcc" },
  ];

  function seriesPath(key) {
    return chartData.map((point, index) => {
      const x = paddingLeft + (index / 120) * plotWidth;
      const y = paddingTop + plotHeight - (point[key] / maxValue) * plotHeight;
      return `${index === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  function areaPath(key) {
    return `${seriesPath(key)} L${paddingLeft + plotWidth},${paddingTop + plotHeight} L${paddingLeft},${paddingTop + plotHeight} Z`;
  }

  function yPosition(value) {
    return paddingTop + plotHeight - (value / maxValue) * plotHeight;
  }

  return (
    <div>
      <div className="countdown-row">
        {fuels.map((fuel) => {
          const depleted = dryDays[fuel.key] !== null;
          const daysUntilEmpty = depleted ? dryDays[fuel.key] : 120;
          const depletionDate = depleted
            ? new Date(FUEL_BASE_DATE.getTime() + dryDays[fuel.key] * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" })
            : "120+ DAYS";
          const status = fuelStatus(daysUntilEmpty, depleted);

          return (
            <div key={fuel.key} className="cd-card">
              <div className="cd-label">{fuel.name}</div>
              <div className="cd-value" style={{ color: depleted ? "var(--crt-red)" : fuelDaysColor(daysUntilEmpty) }}>
                {depleted ? daysUntilEmpty : daysUntilEmpty >= 120 ? "120+" : daysUntilEmpty}
              </div>
              <div className="cd-sub">DAYS UNTIL DEPLETION</div>
              <div className="cd-sub" style={{ color: depleted ? "var(--crt-red)" : "var(--crt-dim)", marginTop: 2 }}>
                {depleted ? `DRY: ${depletionDate}` : depletionDate}
              </div>
              <div className="cd-status" style={{ color: status.color, background: status.bg, border: `1px solid ${status.border}` }}>
                {status.text}
              </div>
            </div>
          );
        })}
      </div>

      <div className="presets">
        {Object.entries(FUEL_SCENARIOS).map(([key, scenario]) => (
          <button
            key={key}
            className={`preset-btn ${preset === key ? "active" : ""}`}
            style={{ border: `1px solid ${scenario.color}`, color: scenario.color }}
            onClick={() => applyPreset(key)}
          >
            {scenario.name}
          </button>
        ))}
      </div>

      <div className="ctrl-box">
        <div className="ctrl-title">INTERACTIVE PARAMETERS</div>
        <div className="ctrl-grid">
          <div className="ctrl-item">
            <label>DEMAND MULTIPLIER <span className="ctrl-val">{demand.toFixed(1)}x</span></label>
            <input type="range" min="0.8" max="2.5" step="0.1" value={demand} onChange={(event) => { setDemand(parseFloat(event.target.value)); setPreset(null); }} />
          </div>
          <div className="ctrl-item">
            <label>IMPORT FLOW RATE <span className="ctrl-val">{imports}%</span></label>
            <input type="range" min="0" max="100" step="5" value={imports} onChange={(event) => { setImports(parseInt(event.target.value, 10)); setPreset(null); }} />
          </div>
        </div>
        <div className="toggle-row">
          <button className={`toggle-btn ${refBoost ? "on" : ""}`} onClick={() => { setRefBoost(!refBoost); setPreset(null); }}>
            {(refBoost ? "[ON]" : "[OFF]") + " SULPHUR WAIVER (+3.3 ML/day petrol)"}
          </button>
          <button className={`toggle-btn ${reserve ? "on" : ""}`} onClick={() => { setReserve(!reserve); setPreset(null); }}>
            {(reserve ? "[ON]" : "[OFF]") + " MSO RESERVE RELEASE (762 ML)"}
          </button>
        </div>
      </div>

      <div className="chart-panel">
        <div className="chart-title">DEPLETION CURVES - MILLION LITRES REMAINING</div>
        <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", fontFamily: "'Share Tech Mono', monospace" }}>
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <line key={`grid-${fraction}`} x1={paddingLeft} y1={y} x2={paddingLeft + plotWidth} y2={y} stroke="#1a3a1a" strokeDasharray="3 3" />;
          })}
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <text key={`label-${fraction}`} x={paddingLeft - 5} y={y + 4} textAnchor="end" fill="#3a7a3a" fontSize="10">{(maxValue * fraction / 1000).toFixed(1)}k</text>;
          })}
          {[0, 30, 60, 90, 120].map((day) => {
            const x = paddingLeft + (day / 120) * plotWidth;
            return <text key={`day-${day}`} x={x} y={paddingTop + plotHeight + 20} textAnchor="middle" fill="#3a7a3a" fontSize="10">{chartData[day] ? chartData[day].date : ""}</text>;
          })}
          <line x1={paddingLeft} y1={yPosition(14 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(14 * FUEL_DAILY_ML.diesel)} stroke="#ffaa00" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(14 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ffaa00" fontSize="9">RATIONING 14d</text>
          <line x1={paddingLeft} y1={yPosition(7 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(7 * FUEL_DAILY_ML.diesel)} stroke="#ff3333" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(7 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ff3333" fontSize="9">EMERGENCY 7d</text>

          <path d={areaPath("petrol")} fill="rgba(51,255,51,0.15)" />
          <path d={areaPath("jet")} fill="rgba(0,255,204,0.15)" />
          <path d={seriesPath("petrol")} fill="none" stroke="#33ff33" strokeWidth="2" />
          <path d={seriesPath("diesel")} fill="none" stroke="#ff6600" strokeWidth="2" />
          <path d={seriesPath("jet")} fill="none" stroke="#00ffcc" strokeWidth="2" />
          <line x1={paddingLeft} y1={paddingTop} x2={paddingLeft} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
          <line x1={paddingLeft} y1={paddingTop + plotHeight} x2={paddingLeft + plotWidth} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
        </svg>
        <div className="legend-row">
          <div className="legend-item"><div className="legend-dot" style={{ background: "#33ff33" }} /> PETROL</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#ff6600" }} /> DIESEL (PRIORITY)</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#00ffcc" }} /> JET FUEL</div>
          <div className="legend-item" style={{ color: "#ffaa00" }}>--- RATIONING (14d)</div>
          <div className="legend-item" style={{ color: "#ff3333" }}>--- EMERGENCY (7d)</div>
        </div>
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">LIVE OUTAGE DATA (via checkpetrol.com.au)</div>
        {BRIEFING.fuelModule.liveContext.map((line) => <div key={line.text} className={`ctx-line ${line.variant === "default" ? "" : line.variant}`}>{line.text}</div>)}
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">FORECAST DATA SOURCES</div>
        {BRIEFING.fuelModule.sourceNotes.map((note) => <div key={note} className="ctx-line">{note}</div>)}
      </div>
    </div>
  );
}

function OPSCEN() {
  const clock = useClock();
  const [openSections, setOpenSections] = useState({ sitrep: true });
  const [allOpen, setAllOpen] = useState(false);
  const [fontSize, setFontSize] = useState(1);
  const [activeTab, setActiveTab] = useState("briefing");
  const fontScale = [14, 16, 19][fontSize];
  const defconLevel = BRIEFING.site.defconLevel;
  const defconInfo = DEFCON_LEVELS.find((item) => item.level === defconLevel);
  const utcStr = formatUtcTime(clock);
  const sydneyStr = formatSydneyTime(clock);
  const deadlineUtc = new Date(BRIEFING.site.deadlineUtc);
  const msLeft = deadlineUtc - clock;
  const daysLeft = Math.max(0, Math.ceil(msLeft / 86400000));
  const countdownStr = msLeft > 0 ? `${daysLeft} DAY${daysLeft !== 1 ? "S" : ""} REMAINING` : "EXPIRED";

  const toggleSection = useCallback((id) => {
    setOpenSections((previous) => ({ ...previous, [id]: !previous[id] }));
  }, []);

  const toggleAll = useCallback(() => {
    const nextState = !allOpen;
    setAllOpen(nextState);
    const nextSections = {};
    BRIEFING.sections.forEach((section) => {
      nextSections[section.id] = nextState;
    });
    setOpenSections(nextSections);
  }, [allOpen]);

  return (
    <React.Fragment>
      <div className="scanlines" />
      <div className="opscen-container" style={{ fontSize: fontScale }}>
        <div className="header-bar">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div className="header-title crt-glow">{"◤"} OPSCEN v{BRIEFING.site.version} {"◢"}</div>
            <div className="font-controls">
              <button className={`font-btn ${fontSize === 0 ? "active" : ""}`} onClick={() => setFontSize(0)} style={{ fontSize: 13 }}>A-</button>
              <button className={`font-btn ${fontSize === 1 ? "active" : ""}`} onClick={() => setFontSize(1)} style={{ fontSize: 16 }}>A</button>
              <button className={`font-btn ${fontSize === 2 ? "active" : ""}`} onClick={() => setFontSize(2)} style={{ fontSize: 20 }}>A+</button>
            </div>
          </div>
          <div className="header-sub">{BRIEFING.site.theatre} &mdash; {BRIEFING.site.operation} &mdash; DAY {BRIEFING.site.day}</div>
          <div className="header-sub" style={{ color: "var(--crt-amber)", marginTop: 2 }}>{BRIEFING.site.subhead}</div>
          <div style={{ textAlign: "center", marginTop: 8, fontSize: 32, color: "var(--crt-amber)", fontFamily: "'Share Tech Mono', monospace", textShadow: "0 0 10px #ffaa00, 0 0 20px #ffaa00" }}>
            GRACE PERIOD: {countdownStr}
          </div>
          <Ticker />
        </div>

        <div className="tab-bar">
          <button className={`tab-btn ${activeTab === "briefing" ? "active" : ""}`} onClick={() => setActiveTab("briefing")}>{"⚡"} BRIEFING</button>
          <button className={`tab-btn ${activeTab === "fuel" ? "active" : ""}`} onClick={() => setActiveTab("fuel")}>{"⛽"} FUEL FORECAST</button>
        </div>

        {activeTab === "briefing" && (
          <React.Fragment>
            <LiveRadioPanel />
            <KeyMetrics />
            <div className="status-row">
              <div className="defcon-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>DEFCON ASSESSMENT</div>
                <DefconGauge level={defconLevel} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span style={{ color: defconInfo.color }}>DEFCON {defconLevel}</span>
                  <span style={{ color: defconInfo.color, fontSize: 12 }}>{defconInfo.label}</span>
                </div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>{BRIEFING.site.defconSummary}</div>
              </div>
              <div className="clock-panel">
                <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
                <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{sydneyStr}</div>
                <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
                <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: {BRIEFING.site.briefingEpoch}</div>
              </div>
            </div>

            <ThreatMatrix />
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}>
              <button className="expand-all-btn" onClick={toggleAll}>{allOpen ? "▼ COLLAPSE ALL" : "▶ EXPAND ALL"}</button>
            </div>
            {BRIEFING.sections.map((section) => (
              <Section key={section.id} section={section} isOpen={!!openSections[section.id]} toggle={() => toggleSection(section.id)} />
            ))}
          </React.Fragment>
        )}

        {activeTab === "fuel" && <FuelForecast />}

        <div className="footer-bar">
          <span>OPSCEN v{BRIEFING.site.version} • RETSA GROUP INTELLIGENCE</span>
          <span>CLASSIFICATION: OPEN SOURCE</span>
          <span><span className="blink" style={{ color: "var(--crt-red)" }}>•</span> {BRIEFING.site.liveLabel}</span>
        </div>
        <div className="built-with">
          Originally built in <a href={BRIEFING.links.claudeUrl} target="_blank" rel="noopener">Claude</a>, now run through a Codex-powered workflow by <a href={BRIEFING.links.companyUrl} target="_blank" rel="noopener">RETSA Group</a> • <a href={BRIEFING.links.authorUrl} target="_blank" rel="noopener">@Marcus_Rummler</a> • Fuel outage data via <a href={BRIEFING.links.fuelUrl} target="_blank" rel="noopener">checkpetrol.com.au</a>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OPSCEN />);
</script>
</body>
</html>
