PENING","color":"var(--crt-cyan)","delta":"ISLAMABAD","deltaColor":"#00ffcc"},{"label":"US CREW","value":"RESCUED","color":"var(--crt-cyan)","delta":"AFTER FIREFIGHT","deltaColor":"#00ffcc"},{"label":"LEBANON","value":"1.4K+","color":"var(--crt-amber)","delta":"1M DISPLACED","deltaColor":"#ffaa00"},{"label":"LEAD SCENARIO","value":"FRAGILE TALKS","color":"var(--crt-amber)","delta":"45%","deltaColor":"#ffaa00"},{"label":"STRIKE CYCLE","value":"30%","color":"var(--crt-cyan)","delta":"PAUSED, NOT RESOLVED","deltaColor":"#ffaa00"}],"threatMatrix":[{"theatre":"IRAN (MAINLAND)","level":"CRITICAL","color":"#ff0000"},{"theatre":"STRAIT OF HORMUZ","level":"CRITICAL","color":"#ff0000"},{"theatre":"ISRAEL (HOME)","level":"SEVERE","color":"#ff4400"},{"theatre":"LEBANON","level":"SEVERE","color":"#ff4400"},{"theatre":"YEMEN/HOUTHIS","level":"SEVERE","color":"#ff4400"},{"theatre":"GULF STATES","level":"HIGH","color":"#ffaa00"},{"theatre":"GLOBAL ECON","level":"HIGH","color":"#ffaa00"},{"theatre":"NUCLEAR","level":"HIGH","color":"#ffaa00"},{"theatre":"AUSTRALIA","level":"ELEVATED","color":"#cccc00"},{"theatre":"IRAQ/PROXIES","level":"ELEVATED","color":"#cccc00"}],"sections":[{"id":"sitrep","title":"SITUATION REPORT","icon":"⚡","content":{"heading":"DAY 43 -- ISLAMABAD TALKS / SHIPPING TEST / PAUSE STILL FRAGILE","lines":["[!] THE IMMEDIATE STRIKE DEADLINE HAS GIVEN WAY to a fragile diplomatic window, with the two-week pause still holding for now and talks opening in Islamabad.","TRUMP CREDITED conversations with Pakistan's Prime Minister Shehbaz Sharif and Field Marshal Asim Munir in explaining the pause.","THE PUBLIC CONDITION ATTACHED remains the complete, immediate and safe opening of the Strait of Hormuz, which means shipping reality now matters more than rhetoric alone.","THE MISSING US CREW MEMBER from the downed F-15 is still reported rescued after the firefight inside Iran, removing one of the most politically sensitive loose ends from the weekend.","TEHRAN'S PUBLIC POSITION had been against the temporary-ceasefire framing and against reopening Hormuz under only a temporary pause, so the next question is whether practice catches up with the announcement.","MEDIATION STILL EXISTS through countries including Pakistan, Turkey and Egypt, which keeps a narrow off-ramp alive even as mistrust remains high.","THE STRAIT REMAINS TECHNICALLY OPEN but commercially distorted. The market still cares more about risk and interference than legal navigability.","WASHINGTON'S PUBLIC POSTURE has moved from immediate-strike coercion to conditional pause enforcement tied to Hormuz and a 10-point proposal.","MARKETS REMAIN HEADLINE-DRIVEN, but the shift is now from deadline panic to talks credibility and shipping proof.","THE HUMAN COST CONTINUES TO RISE across multiple fronts even as global attention snaps back to whether this temporary off-ramp can hold.","WORKING JUDGMENT: the crisis has not resolved; it has moved into a short verification window."]}},{"id":"kinetic","title":"KINETIC OPERATIONS","icon":"🎯","content":{"heading":"AIR CAMPAIGN PAUSED AT THE TOP LEVEL / RESCUE OPERATION COMPLETED / STRIKE RISK NOT GONE","lines":["WASHINGTON HAS PUBLICLY ACKNOWLEDGED losing two warplanes during the Iran campaign. That keeps the air war costly and politically visible.","THE MISSING CREW MEMBER is now reportedly rescued, which closes a major tactical and political loose end from the downing of the F-15.","IRANIAN AIR DEFENCES are still contesting the skies enough to disrupt assumptions of complete allied air dominance.","THE TOP-LINE STRIKE PACKAGE is paused for now, but that does not mean the broader military picture has become stable.","THE KEY MILITARY SIGNAL is that neither side is acting like a permanent ceasefire is imminent; force posture is still being used to shape the negotiating table.","IRAN'S WARNING TO THE GULF REMAINS IN PLACE: attacks on southern coastal infrastructure could trigger much wider maritime disruption.","ISRAEL'S NORTHERN FRONT REMAINS ACTIVE, forcing resources to be split between Iran, Lebanon and home-defence tasks.","COMMERCIAL AVIATION AND SHIPPING remain under stress because the military picture still points to escalation risk, not stabilisation.","EACH FRESH LOSS OR STRIKE now has outsized narrative impact because both camps are trying to prove momentum without conceding vulnerability.","WORKING JUDGMENT: the kinetic phase is still driving the diplomatic phase, not the other way around."]}},{"id":"iran_response","title":"IRANIAN RETALIATION","icon":"🚀","content":{"heading":"IRAN HAS NOT PUBLICLY OWNED THE PAUSE / MEDIATED CONTACT STILL EXISTS / NO SURRENDER SIGNAL","lines":["IRAN'S OFFICIAL LINE: the ultimatum is hostile and imbalanced, and the US is misrepresenting mediated contact as capitulation.","AT THE SAME TIME, Iranian officials have acknowledged receiving US points through intermediaries. The channel still exists even if the public framing is hostile.","FOREIGN MINISTER ARAQCHI has signalled that trust for direct talks is close to zero, which is posture as much as substance.","IRAN CONTINUES TO USE DUAL-TRACK MESSAGING: public defiance for domestic and regional audiences, quiet message-passing to avoid strategic isolation.","THE REGIME IS TRYING TO SHOW it can absorb pressure, reject humiliation and still keep a pathway open if the military balance worsens.","IRAN'S STRAIT THREAT STILL MATTERS because every denial of talks raises the odds that shipping pressure is used as leverage instead.","PUBLIC DENIAL DOES NOT EQUAL NO CONTACT. For the dashboard, the better reading is 'mediated diplomacy under maximal coercion'.","THE COST OF MISREADING THIS is high: markets are reacting to headline rhetoric while the actual signal is buried in intermediary traffic.","IF THE TWO-WEEK WINDOW HOLDS, Tehran can frame it as pressure absorbed without formal surrender. If it collapses quickly, deterrence language will harden again.","WORKING JUDGMENT: diplomacy is alive, but only through deniable of mining keep the strait operating below anything resembling normal conditions.","THIS IS WHY OIL HASN'T NORMALISED even on diplomacy headlines: the market still sees fragile access, not restored confidence.","MEDIATORS HAVE BOUGHT TIME, but the shipping picture still says the private channel has not yet delivered full operational relief and Tehran has not publicly embraced every condition.","THE LONGER COMMERCIAL CONDITIONS STAY DISTORTED, the more likely importers keep rerouting, delaying cargoes or paying crisis pricing even under a pause.","FOR AUSTRALIA, THE STRAIT QUESTION matters less as a legal status issue and more as a shipping-risk issue. Cargo certainty is what counts.","A TRUE DE-ESCALATION SIGNAL WOULD BE visible commercial normalisation, not just political statements. That has not happened yet.","IF THE PAUSE BREAKS DOWN, Hormuz remains the fastest lever for renewed global energy panic.","WORKING JUDGMENT: de facto disruption persists, and the market still treats the strait as a live coercion zone despite the pause."]}},{"id":"oil","title":"OIL & ENERGY MARKETS","icon":"🛢️","content":{"heading":"TALKS UNDERWAY / RELIEF CAPPED / SHIPPING RISK STILL DOMINATES","lines":["CRUDE HAS FALLEN SHARPLY from the panic highs, but it remains sensitive because shipping risk has not been solved, only partially repriced.","THE MOST IMPORTANT MARKET PATTERN is not a single print, but the speed of reversals every time Washington or Tehran changes tone.","CURRENT MARKET COVERAGE describes a capped relief move as traders price out the most immediate strike-risk premium but keep a material Hormuz risk premium in place.","ENERGY INFRASTRUCTURE RISK is still shaping market psychology, which is why a political pause alone has not reset pricing all the way back to pre-crisis levels.","EUROPE IS NOW CONSIDERING a windfall tax on producers and even partial strategic fuel rationing if the disruption stretches on.","IMPORTERS ARE STILL PAYING a wartime premium through insurance, .","BOTTOM LINE: if the energy disruption persists, Australia will feel it through prices before it feels it through shortages."]}},{"id":"fuel_au","title":"AUSTRALIA FUEL SITUATION","icon":"⛽","content":{"heading":"AU FUEL WATCH CONTINUES / 50+ SHIPS INBOUND / OUTAGES EASING BUT NOT GONE","lines":["CHECKPETROL'S LIVE TRACKER still shows outages around the country, though recent reporting says the national number has been easing from the earlier spike.","THE GUARDIAN REPORTED on Friday, April 3 that the government says more than 50 fuel ships are now headed to Australia.","ENERGY MINISTER CHRIS BOWEN said the country had roughly 39 days of petrol, 29 days of diesel and 30 days of jet fuel on hand, with fresh cargoes expected around mid-April.","THAT DOES NOT MEAN ALL CLEAR: local outages can still happen even when national stocks look manageable on paper.","AUSTRALIA'S VULNERABILITY is its reliance on imported refined product from Asia. If regional disruption lingers, local stability stays fragile.","PETROL PAIN IS VISIBLE TO CONSUMERS first, but diesel remains the strategic fuel because it underpins freight, agriculture, mining and backup power.","THE BEST SIGNAL FOR THIS PANEL is not rhetoric out of Washington; it is whether ships actually berth on time and refill the system.","IF THE TWO-WEEK PAUSE FAILS, the fuel-watch story extends. If mediation buys time, pressure should ease gradually rather than instantly.","WORKING JUDGMENT: Australia is still in a stressed but improving, not yet systemic, fuel position.","BOTTOM LINE: monitor CheckPetrol for local pain, but watch inbound cargoes for national relief."]}},{"id":"scenarios","title":"SCENARIO ANALYSIS","icon":"🔮","content":{"heading":"DAY 43 -- TALKS OPEN / NARROW OFF-RAMP / OUTCOME STILL FRAGILE","lines":["[!] LEAD SCENARIO -- TALKS HOLD THE LINE (45%): the two-week window survives, rhetoric stays hostile, and mediators use Islamabad to try to turn a pause into a structured off-ramp.","SCENARIO A -- EXTENDED         <div key={metric.label} className="metric-card">

function useClock() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  return now;
}

function formatSydneyTime(date) {
  const formatter = new Intl.DateTimeFormat("en-AU", {
    timeZone: "Australia/Sydney",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false,
    timeZoneName: "short",
  });
  const parts = formatter.formatToParts(date);
  const get = (type) => parts.find((part) => part.type === type)?.value || "";
  return get("year") + "-" + get("month") + "-" + get("day") + " " + get("hour") + ":" + get("minute") + ":" + get("second") + " " + get("timeZoneName");
}

function formatUtcTime(date) {
  return date.toISOString().replace("T", " ").slice(0, 19) + "Z";
}

const FUEL_BASE_DATE = new Date(BRIEFING.fuelModule.baseDate);
const FUEL_STOCKS_ML = BRIEFING.fuelModule.stocksMl;
const FUEL_DAILY_ML = BRIEFING.fuelModule.dailyMl;
const FUEL_MSO_ML = BRIEFING.fuelModule.msoMl;
const FUEL_SCENARIOS = BRIEFING.fuelModule.scenarios;

function projectFuel(params) {
  const importFactor = params.imports / 100;
  const data = [];
  const stocks = { ...FUEL_STOCKS_ML };
  const reservePerDay = {
    petrol: params.reserve ? FUEL_MSO_ML.petrol / 21 : 0,
    diesel: params.reserve ? FUEL_MSO_ML.diesel / 21 : 0,
    jet: 0,
  };
  const dryDays = { petrol: null, diesel: null, jet: null };

  for (let day = 0; day <= 120; day += 1) {
    data.push({
      day,
      date: new Date(FUEL_BASE_DATE.getTime() + day * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" }),
      petrol: Math.max(0, stocks.petrol),
      diesel: Math.max(0, stocks.diesel),
      jet: Math.max(0, stocks.jet),
    });

    ["petrol", "diesel", "jet"].forEach((fuel) => {
      const consumption = FUEL_DAILY_ML[fuel] * params.demand;
      const imports = FUEL_DAILY_ML[fuel] * importFactor;
      const refineryBoost = fuel === "petrol" && params.refBoost ? 3.3 : 0;
      const reserveRelease = day >= 7 && day < 28 ? reservePerDay[fuel] : 0;

      stocks[fuel] = stocks[fuel] - consumption + imports + refineryBoost + reserveRelease;

      if (stocks[fuel] <= 0 && dryDays[fuel] === null) {
        dryDays[fuel] = day;
        stocks[fuel] = 0;
      }
    });
  }

  return { data, dryDays };
}

function fuelDaysColor(days) {
  if (days <= 7) return "var(--crt-red)";
  if (days <= 14) return "var(--crt-amber)";
  return "var(--crt-green)";
}

function fuelStatus(daysUntilEmpty, depleted) {
  if (depleted) return { text: "DEPLETED", color: "var(--crt-red)", bg: "rgba(255,50,50,0.15)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 7) return { text: "EMERGENCY", color: "var(--crt-red)", bg: "rgba(255,50,50,0.1)", border: "var(--crt-red)" };
  if (daysUntilEmpty <= 14) return { text: "RATIONING LIKELY", color: "var(--crt-amber)", bg: "rgba(255,170,0,0.1)", border: "var(--crt-amber)" };
  return { text: "MONITORING", color: "var(--crt-green)", bg: "rgba(50,255,50,0.05)", border: "var(--crt-green)" };
}

function FuelForecast() {
  const [demand, setDemand] = useState(FUEL_SCENARIOS.current.demand);
  const [imports, setImports] = useState(FUEL_SCENARIOS.current.imports);
  const [refBoost, setRefBoost] = useState(FUEL_SCENARIOS.current.refBoost);
  const [reserve, setReserve] = useState(FUEL_SCENARIOS.current.reserve);
  const [preset, setPreset] = useState("current");

  function applyPreset(key) {
    const scenario = FUEL_SCENARIOS[key];
    setDemand(scenario.demand);
    setImports(scenario.imports);
    setRefBoost(scenario.refBoost);
    setReserve(scenario.reserve);
    setPreset(key);
  }

  const result = projectFuel({ demand, imports, refBoost, reserve });
  const chartData = result.data;
  const dryDays = result.dryDays;
  const width = 900;
  const height = 300;
  const paddingLeft = 55;
  const paddingRight = 15;
  const paddingTop = 15;
  const paddingBottom = 35;
  const plotWidth = width - paddingLeft - paddingRight;
  const plotHeight = height - paddingTop - paddingBottom;
  const maxValue = Math.max(FUEL_STOCKS_ML.petrol, FUEL_STOCKS_ML.diesel, FUEL_STOCKS_ML.jet) * 1.05;
  const fuels = [
    { name: "PETROL", key: "petrol", color: "#33ff33" },
    { name: "DIESEL", key: "diesel", color: "#ff6600" },
    { name: "JET FUEL", key: "jet", color: "#00ffcc" },
  ];

  function seriesPath(key) {
    return chartData.map((point, index) => {
      const x = paddingLeft + (index / 120) * plotWidth;
      const y = paddingTop + plotHeight - (point[key] / maxValue) * plotHeight;
      return `${index === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  function areaPath(key) {
    return `${seriesPath(key)} L${paddingLeft + plotWidth},${paddingTop + plotHeight} L${paddingLeft},${paddingTop + plotHeight} Z`;
  }

  function yPosition(value) {
    return paddingTop + plotHeight - (value / maxValue) * plotHeight;
  }

  return (
    <div>
      <div className="countdown-row">
        {fuels.map((fuel) => {
          const depleted = dryDays[fuel.key] !== null;
          const daysUntilEmpty = depleted ? dryDays[fuel.key] : 120;
          const depletionDate = depleted
            ? new Date(FUEL_BASE_DATE.getTime() + dryDays[fuel.key] * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" })
            : "120+ DAYS";
          const status = fuelStatus(daysUntilEmpty, depleted);

          return (
            <div key={fuel.key} className="cd-card">
              <div className="cd-label">{fuel.name}</div>
              <div className="cd-value" style={{ color: depleted ? "var(--crt-red)" : fuelDaysColor(daysUntilEmpty) }}>
                {depleted ? daysUntilEmpty : daysUntilEmpty >= 120 ? "120+" : daysUntilEmpty}
              </div>
              <div className="cd-sub">DAYS UNTIL DEPLETION</div>
              <div className="cd-sub" style={{ color: depleted ? "var(--crt-red)" : "var(--crt-dim)", marginTop: 2 }}>
                {depleted ? `DRY: ${depletionDate}` : depletionDate}
              </div>
              <div className="cd-status" style={{ color: status.color, background: status.bg, border: `1px solid ${status.border}` }}>
                {status.text}
              </div>
            </div>
          );
        })}
      </div>

      <div className="presets">
        {Object.entries(FUEL_SCENARIOS).map(([key, scenario]) => (
          <button
            key={key}
            className={`preset-btn ${preset === key ? "active" : ""}`}
            style={{ border: `1px solid ${scenario.color}`, color: scenario.color }}
            onClick={() => applyPreset(key)}
          >
            {scenario.name}
          </button>
        ))}
      </div>

      <div className="ctrl-box">
        <div className="ctrl-title">INTERACTIVE PARAMETERS</div>
        <div className="ctrl-grid">
          <div className="ctrl-item">
            <label>DEMAND MULTIPLIER <span className="ctrl-val">{demand.toFixed(1)}x</span></label>
            <input type="range" min="0.8" max="2.5" step="0.1" value={demand} onChange={(event) => { setDemand(parseFloat(event.target.value)); setPreset(null); }} />
          </div>
          <div className="ctrl-item">
            <label>IMPORT FLOW RATE <span className="ctrl-val">{imports}%</span></label>
            <input type="range" min="0" max="100" step="5" value={imports} onChange={(event) => { setImports(parseInt(event.target.value, 10)); setPreset(null); }} />
          </div>
        </div>
        <div className="toggle-row">
          <button className={`toggle-btn ${refBoost ? "on" : ""}`} onClick={() => { setRefBoost(!refBoost); setPreset(null); }}>
            {(refBoost ? "[ON]" : "[OFF]") + " SULPHUR WAIVER (+3.3 ML/day petrol)"}
          </button>
          <button className={`toggle-btn ${reserve ? "on" : ""}`} onClick={() => { setReserve(!reserve); setPreset(null); }}>
            {(reserve ? "[ON]" : "[OFF]") + " MSO RESERVE RELEASE (762 ML)"}
          </button>
        </div>
      </div>

      <div className="chart-panel">
        <div className="chart-title">DEPLETION CURVES - MILLION LITRES REMAINING</div>
        <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", fontFamily: "'Share Tech Mono', monospace" }}>
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <line key={`grid-${fraction}`} x1={paddingLeft} y1={y} x2={paddingLeft + plotWidth} y2={y} stroke="#1a3a1a" strokeDasharray="3 3" />;
          })}
          {[0, 0.25, 0.5, 0.75, 1].map((fraction) => {
            const y = paddingTop + plotHeight * (1 - fraction);
            return <text key={`label-${fraction}`} x={paddingLeft - 5} y={y + 4} textAnchor="end" fill="#3a7a3a" fontSize="10">{(maxValue * fraction / 1000).toFixed(1)}k</text>;
          })}
          {[0, 30, 60, 90, 120].map((day) => {
            const x = paddingLeft + (day / 120) * plotWidth;
            return <text key={`day-${day}`} x={x} y={paddingTop + plotHeight + 20} textAnchor="middle" fill="#3a7a3a" fontSize="10">{chartData[day] ? chartData[day].date : ""}</text>;
          })}
          <line x1={paddingLeft} y1={yPosition(14 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(14 * FUEL_DAILY_ML.diesel)} stroke="#ffaa00" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(14 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ffaa00" fontSize="9">RATIONING 14d</text>
          <line x1={paddingLeft} y1={yPosition(7 * FUEL_DAILY_ML.diesel)} x2={paddingLeft + plotWidth} y2={yPosition(7 * FUEL_DAILY_ML.diesel)} stroke="#ff3333" strokeDasharray="6 3" />
          <text x={paddingLeft + plotWidth - 5} y={yPosition(7 * FUEL_DAILY_ML.diesel) - 4} textAnchor="end" fill="#ff3333" fontSize="9">EMERGENCY 7d</text>
          <path d={areaPath("diesel")} fill="rgba(255,102,0,0.15)" />
          <path d={areaPath("petrol")} fill="rgba(51,255,51,0.15)" />
          <path d={areaPath("jet")} fill="rgba(0,255,204,0.15)" />
          <path d={seriesPath("petrol")} fill="none" stroke="#33ff33" strokeWidth="2" />
          <path d={seriesPath("diesel")} fill="none" stroke="#ff6600" strokeWidth="2" />
          <path d={seriesPath("jet")} fill="none" stroke="#00ffcc" strokeWidth="2" />
          <line x1={paddingLeft} y1={paddingTop} x2={paddingLeft} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
          <line x1={paddingLeft} y1={paddingTop + plotHeight} x2={paddingLeft + plotWidth} y2={paddingTop + plotHeight} stroke="#3a7a3a" />
        </svg>
        <div className="legend-row">
          <div className="legend-item"><div className="legend-dot" style={{ background: "#33ff33" }} /> PETROL</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#ff6600" }} /> DIESEL (PRIORITY)</div>
          <div className="legend-item"><div className="legend-dot" style={{ background: "#00ffcc" }} /> JET FUEL</div>
          <div className="legend-item" style={{ color: "#ffaa00" }}>--- RATIONING (14d)</div>
          <div className="legend-item" style={{ color: "#ff3333" }}>--- EMERGENCY (7d)</div>
        </div>
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">LIVE OUTAGE DATA (via checkpetrol.com.au)</div>
        {BRIEFING.fuelModule.liveContext.map((line) => <div key={line.text} className={`ctx-line ${line.variant === "default" ? "" : line.variant}`}>{line.text}</div>)}
      </div>

      <div className="ctx-notes">
        <div className="ctx-title">FORECAST DATA SOURCES</div>
        {BRIEFING.fuelModule.sourceNotes.map((note) => <div key={note} className="ctx-line">{note}</div>)}
      </div>
    </div>
  );
}

function OPSCEN() {
  const clock = useClock();
  const [openSections, setOpenSections] = useState({ sitrep: true });
  const [allOpen, setAllOpen] = useState(false);
  const [fontSize, setFontSize] = useState(1);
  const [activeTab, setActiveTab] = useState("briefing");
  const fontScale = [14, 16, 19][fontSize];
  const defconLevel = BRIEFING.site.defconLevel;
  const defconInfo = DEFCON_LEVELS.find((item) => item.level === defconLevel);
  const utcStr = formatUtcTime(clock);
  const sydneyStr = formatSydneyTime(clock);
  const deadlineUtc = new Date(BRIEFING.site.deadlineUtc);
  const msLeft = deadlineUtc - clock;
  const daysLeft = Math.max(0, Math.ceil(msLeft / 86400000));
  const countdownStr = msLeft > 0 ? `${daysLeft} DAY${daysLeft !== 1 ? "S" : ""} REMAINING` : "EXPIRED";

  const toggleSection = useCallback((id) => {
    setOpenSections((previous) => ({ ...previous, [id]: !previous[id] }));
  }, []);

  const toggleAll = useCallback(() => {
    const nextState = !allOpen;
    setAllOpen(nextState);
    const nextSections = {};
    BRIEFING.sections.forEach((section) => {
      nextSections[section.id] = nextState;
    });
    setOpenSections(nextSections);
  }, [allOpen]);

  return (
    <React.Fragment>
      <div className="scanlines" />
      <div className="opscen-container" style={{ fontSize: fontScale }}>
        <div className="header-bar">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 18 }}>
            <div className="header-kicker">LIVE // DEFCON {defconLevel} // DAY {BRIEFING.site.day}</div>
            <div className="font-controls">
              <button className={`font-btn ${fontSize === 0 ? "active" : ""}`} onClick={() => setFontSize(0)} style={{ fontSize: 13 }}>A-</button>
              <button className={`font-btn ${fontSize === 1 ? "active" : ""}`} onClick={() => setFontSize(1)} style={{ fontSize: 16 }}>A</button>
              <button className={`font-btn ${fontSize === 2 ? "active" : ""}`} onClick={() => setFontSize(2)} style={{ fontSize: 20 }}>A+</button>
            </div>
          </div>
          <div className="header-shell">
            <div className="header-copy">
              <div className="header-title crt-glow">OPSCEN v{BRIEFING.site.version}</div>
              <div className="header-meta">
                <div className="header-line">{BRIEFING.site.theatre}</div>
                <div className="header-line">{BRIEFING.site.operation} &mdash; DAY {BRIEFING.site.day}</div>
              </div>
              <div className="header-hero">
                <div className="header-alert">{BRIEFING.site.subhead}</div>
                <div className="header-summary">
                  {BRIEFING.readme.currentBriefing[0]} {BRIEFING.readme.currentBriefing[1]}
                </div>
              </div>
            </div>
            <div className="grace-card">
              <div className="grace-label">Grace Period</div>
              <div className="grace-value">{countdownStr.replace(" REMAINING", "")}</div>
              <div className="grace-sub">Remaining in current pause window</div>
            </div>
          </div>
          <div className="header-strip">
            <div className="header-strip-item">briefing epoch // {BRIEFING.site.briefingEpoch}</div>
            <div className="header-strip-item">defcon // {defconLevel}</div>
            <div className="header-strip-item">lead scenario // {BRIEFING.keyMetrics[6]?.value || "n/a"} {BRIEFING.keyMetrics[6]?.delta || ""}</div>
          </div>
          <Ticker />
        </div>

        <div className="controls-band">
          <div className="tab-bar">
            <button className={`tab-btn ${activeTab === "briefing" ? "active" : ""}`} onClick={() => setActiveTab("briefing")}>{"⚡"} BRIEFING</button>
            <button className={`tab-btn ${activeTab === "fuel" ? "active" : ""}`} onClick={() => setActiveTab("fuel")}>{"⛽"} FUEL FORECAST</button>
          </div>
        </div>

        {activeTab === "briefing" && (
          <div className="content-stack">
            <div className="briefing-stack">
              <KeyMetrics />
              <div className="status-row">
                <div className="defcon-panel">
                  <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>DEFCON ASSESSMENT</div>
                  <DefconGauge level={defconLevel} />
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                    <span style={{ color: defconInfo.color }}>DEFCON {defconLevel}</span>
                    <span style={{ color: defconInfo.color, fontSize: 12 }}>{defconInfo.label}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>{BRIEFING.site.defconSummary}</div>
                </div>
                <div className="clock-panel">
                  <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
                  <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{sydneyStr}</div>
                  <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
                  <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: {BRIEFING.site.briefingEpoch}</div>
                </div>
              </div>
              <ThreatMatrix />
            </div>

            <div className="briefing-stack">
              <LiveRadioPanel />
              <div style={{ display: "flex", justifyContent: "flex-end" }}>
                <button className="expand-all-btn" onClick={toggleAll}>{allOpen ? "▼ COLLAPSE ALL" : "▶ EXPAND ALL"}</button>
              </div>
              <div className="briefing-stack">
                {BRIEFING.sections.map((section) => (
                  <Section key={section.id} section={section} isOpen={!!openSections[section.id]} toggle={() => toggleSection(section.id)} />
                ))}
              </div>
            </div>
          </div>
        )}

        {activeTab === "fuel" && <FuelForecast />}

        <div className="footer-bar">
          <span>OPSCEN v{BRIEFING.site.version} • RETSA GROUP INTELLIGENCE</span>
          <span>CLASSIFICATION: OPEN SOURCE</span>
          <span><span className="blink" style={{ color: "var(--crt-red)" }}>•</span> {BRIEFING.site.liveLabel}</span>
        </div>
        <div className="built-with">
          Originally built in <a href={BRIEFING.links.claudeUrl} target="_blank" rel="noopener">Claude</a>, now run through a Codex-powered workflow by <a href={BRIEFING.links.companyUrl} target="_blank" rel="noopener">RETSA Group</a> • <a href={BRIEFING.links.authorUrl} target="_blank" rel="noopener">@Marcus_Rummler</a> • Fuel outage data via <a href={BRIEFING.links.fuelUrl} target="_blank" rel="noopener">checkpetrol.com.au</a>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OPSCEN />);
</script>
</body>
</html>
