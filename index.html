const FUEL_DAILY_ML = { petrol: 43.4, diesel: 91.9, jet: 28 };
const FUEL_MSO_ML = { petrol: 400, diesel: 362, jet: 0 };
const FUEL_SULPHUR_BOOST = 3.3;
const FUEL_SCENARIOS = {
  optimistic: { name: "GOVT OPTIMISTIC", demand: 1.0, imports: 80, refBoost: true, reserve: true, color: "#44cc44" },

  prolonged: { name: "HORMUZ PROLONGED", demand: 1.5, imports: 30, refBoost: true, reserve: true, color: "#ff6600" },
  worst: { name: "WORST CASE", demand: 2.0, imports: 10, refBoost: false, reserve: false, color: "#ff0000" },
};

function projectFuel(params) {
  const { demand, imports, refBoost, reserve } = params;
  const impFrac = imports / 100;
  const data = [];
  let stocks = { ...FUEL_STOCKS_ML };
  const relPerDay = { petrol: reserve ? FUEL_MSO_ML.petrol / 21 : 0, diesel: reserve ? FUEL_MSO_ML.diesel / 21 : 0, jet: 0 };
  let dryDays = { petrol: null, diesel: null, jet: null };
  for (let d = 0; d <= 120; d++) {
    data.push({ day: d, date: new Date(FUEL_BASE_DATE.getTime() + d * 86400000).toLocaleDateString("en-AU", { day: "numeric", month: "short" }),
      petrol: Math.max(0, stocks.petrol), diesel: Math.max(0, stocks.diesel), jet: Math.max(0, stocks.jet) });
    ["petrol", "diesel", "jet"].forEach((f) => {
      const consumed = FUEL_DAILY_ML[f] * demand;
      const imported = FUEL_DAILY_ML[f] * impFrac;
      let boost = (f === "petrol" && refBoost) ? FUEL_SULPHUR_BOOST : 0;
      let rel = (d >= 7 && d < 28) ? relPerDay[f] : 0;
      stocks[f] = stocks[f] - consumed + imported + boost + rel;
      if (stocks[f] <= 0 && dryDays[f] === null) { dryDays[f] = d; stocks[f] = 0; }
    });
  }
  return { data, dryDays };
}

function fuelDaysColor(days) { return days <= 7 ? "var(--crt-red)" : days <= 14 ? "var(--crt-amber)" : "var(--crt-green)"; }
function fuelStatus(days) {
  if (days <= 0) return { text: "DEPLETED", color: "var(--crt-red)", bg: "rgba(255,50,50,0.15)", border: "var(--crt-red)" };
  if (days <= 7) return { text: "EMERGENCY", color: "var(--crt-red)", bg: "rgba(255,50,50,0.1)", border: "var(--crt-red)" };
  if (days <= 14) return { text: "RATIONING LIKELY", color: "var(--crt-amber)", bg: "rgba(255,170,0,0.1)", border: "var(--crt-amber)" };
  return { text: "MONITORING", color: "var(--crt-green)", bg: "rgba(50,255,50,0.05)", border: "var(--crt-green)" };
}
