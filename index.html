              <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>GRACE EXTENDED APR 6 &bull; IRGC NAVY CHIEF KILLED &bull; 82ND AIRBORNE DEPLOYING</div>
            </div>
            <div className="clock-panel">
              <div style={{ fontSize: 14, color: "var(--crt-green)", letterSpacing: 2 }}>SYSTEM CLOCK</div>
              <div style={{ fontSize: 22, color: "var(--crt-amber)", marginTop: 6, fontFamily: "'Share Tech Mono', monospace" }}>{aestStr}</div>
              <div style={{ fontSize: 13, color: "var(--crt-dim)", marginTop: 2, fontFamily: "'Share Tech Mono', monospace" }}>{utcStr}</div>
              <div style={{ fontSize: 12, color: "var(--crt-dim)", marginTop: 4 }}>BRIEFING EPOCH: 28-MAR-2026 0800 AEDT</div>
            </div>
          </div>
          <ThreatMatrix />
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 6 }}><button className="expand-all-btn" onClick={toggleAll}>{allOpen ? "\u25BC COLLAPSE ALL" : "\u25B6 EXPAND ALL"}</button></div>
          {SECTIONS.map((s) => (<Section key={s.id} section={s} isOpen={!!openSections[s.id]} toggle={() => toggle(s.id)} />))}
        </React.Fragment>)}
        {activeTab === "fuel" && <FuelForecast />}
        <div className="footer-bar"><span>OPSCEN v6.4 &bull; RETSA GROUP INTELLIGENCE</span><span>CLASSIFICATION: OPEN SOURCE</span><span><span className="blink" style={{ color: "var(--crt-red)" }}>&bull;</span> LIVE</span></div>
        <div className="built-with">Built entirely in <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a> by <a href="https://retsagroup.com.au" target="_blank" rel="noopener">RETSA Group</a> &bull; <a href="https://x.com/Marcus_Rummler" target="_blank" rel="noopener">@Marcus_Rummler</a></div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<OPSCEN />);

</script>
</body>
</html>
